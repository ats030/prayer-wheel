<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Prayer Wheel · 音声マニ車</title>
  <link rel="stylesheet" href="style.css">
  <script src="http://ubuntu-server-app:8526/v.js" data-site="prayer-wheel" defer></script>
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="eyebrow">Prayer Wheel · 音声マニ車</p>
        <h1>転じて読める</h1>
      </div>
      <p class="tagline">輪を回すたび、心経を一節ずつ。スクロール、タップ、矢印キーで進められます。</p>
    </header>

    <div class="voice-banner" id="voiceBanner" role="alert" hidden></div>
    <button class="btn" id="reloadBtn" hidden>ページを再読み込み</button>

    <main class="grid">
      <section class="panel stage-panel" aria-label="マニ車">
        <div class="stage" id="stage" tabindex="0" role="button" aria-disabled="true"
             aria-keyshortcuts="Enter ArrowDown ArrowUp PageDown PageUp Space"
             aria-label="輪を回す。タップ、クリック、Enter、下矢印で次へ。上矢印で予約取消か前の節へ。Spaceで一時停止・再開。">
          <div class="wheel">
            <svg id="dial" class="dial" viewBox="0 0 400 400" aria-hidden="true">
              <defs>
                <path id="rimPath" d="M 200 32 a 168 168 0 1 1 -0.01 0"></path>
              </defs>
              <circle class="c-rim-outer" cx="200" cy="200" r="192"/>
              <circle class="c-rim-track" cx="200" cy="200" r="168"/>
              <circle class="c-rim-inner" cx="200" cy="200" r="148"/>
              <text class="rim-text"><textPath href="#rimPath" id="rimTextPath"></textPath></text>
              <g id="spokes"></g>
              <g id="petals"></g>
              <circle class="c-hub" cx="200" cy="200" r="58"/>
              <circle class="c-hub-rim" cx="200" cy="200" r="44"/>
              <circle class="c-mark" cx="200" cy="32" r="3"/>
            </svg>
            <div class="hub-counter">
              <span class="counter-num" id="counter">0</span>
              <span class="counter-label">操作数</span>
            </div>
          </div>
        </div>
        <p class="stage-hint">スクロール／タップ: 次へ<br>逆スクロール／「戻る」: 予約取消・前の節へ<br>キー ↓ / ↑ ・ Space: 一時停止／再開</p>
      </section>

      <section class="panel read-panel" aria-label="読み上げ本文">
        <div class="statusline">
          <span class="dot" id="statusDot"></span>
          <span class="status-text" id="statusText" role="status">経文を読み込んでいます…</span>
          <span class="rounds">完了 <b id="rounds">0</b> 巡</span>
        </div>

        <blockquote class="current" id="currentLine">—</blockquote>
        <p class="current-reading" id="currentReading"></p>
        <p class="queue-label">待っている節 <b id="queueCount">0</b> / 5</p>

        <div class="text-block" id="textBlock"></div>

        <div class="progress" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        <p class="progress-label" id="progressLabel">—</p>

        <div class="controls">
          <div class="control-row">
            <label class="field">
              <span>速度 <b id="rateOut">1.0×</b></span>
              <input type="range" id="rate" min="0.6" max="1.4" step="0.05" value="1">
            </label>
          </div>
          <div class="control-row">
            <button class="btn" id="backBtn" disabled>戻る</button>
            <button class="btn btn-primary" id="restartBtn" disabled>最初から</button>
            <button class="btn" id="pauseBtn" disabled>一時停止</button>
            <button class="btn" id="retryBtn" hidden>音声を再試行</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <p>心経の音声を収録済み。音声エンジンのインストールは不要です。</p>
      <p>音声: <a href="https://voicevox.hiroshiba.jp/nemo/">VOICEVOX Nemo</a>（男声1）</p>
    </footer>
  </div>
  <noscript><p>読経を進めるにはJavaScriptを有効にしてください。</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
