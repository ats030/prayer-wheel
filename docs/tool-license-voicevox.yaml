reviewed_at: 2026-09-24
decision: approved
intended_use: local text-to-speech on evo-x2 for kangaeru-mame and dekita audio (ずんだもん, speaker 0)
sources:
  - name: VOICEVOX Engine
    version: 0.25.2 (linux-cpu-x64)
    cost: free
    license: LGPL-3.0 (dual-licensed; a non-LGPL license is available from the author on request)
    commercial_use: allowed
    attribution: keep the bundled LICENSE and licenses.json when redistributing the engine
    restriction: the engine is run unmodified from the official release and is not redistributed
    evidence: https://github.com/VOICEVOX/voicevox_engine/releases/tag/0.25.2
  - name: VOICEVOX Engine bundled dependencies
    version: licenses.json in the 0.25.2 package (50 entries, including VOICEVOX CORE, ONNX Runtime 1.17.3, Open JTalk 1.11, pyopenjtalk)
    cost: free
    license: per entry in licenses.json
    commercial_use: allowed under the bundled terms
    attribution: preserved by keeping licenses.json alongside the engine
    restriction: none beyond the bundled terms because nothing is redistributed
    evidence: ~/voicevox/extracted/linux-cpu-x64/licenses.json
  - name: ずんだもん voice (VOICEVOX character)
    cost: free
    license: character terms of use (per-character, set by the rights holder)
    commercial_use: allowed under the character terms
    attribution: "VOICEVOX:ずんだもん" must be shown where generated audio is published
    restriction: follow the character guidelines; do not use for content the terms prohibit
    evidence: https://zunko.jp/con_ongen_kiyaku.html
adoption_reason: offline Japanese TTS that runs on CPU without per-request API cost; restores the previously used engine (ats030-cur9)
