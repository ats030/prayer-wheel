# 障害の扱いを全ユニットで揃える drop-in (ats030-lnpz)。
# 個別ユニットを書き換えず drop-in にしてあるので、外すときは *.d/failure-policy.conf を消せばよい。
[Unit]
# 再起動の暴走を止める。既定は 10秒間に5回だが RestartSec=10 だと窓を超えず永久に
# 回り続ける。実測: x-analyzer が11分で63回、daily-reflection が16分で89回再起動した。
# 5分間に5回を超えたら failed で止め、下の OnFailure= が通知する。
StartLimitIntervalSec=300
StartLimitBurst=5
OnFailure=notify-failure@%N.service

[Service]
# 143 = SIGTERM。systemctl restart や、ポートを奪う起動スクリプトの kill で普通に出る。
# これを failure にしていたため image-generator だけで7日60回 failed になっていた。
# 意図的な停止であって障害ではない (OOM Killer は SIGKILL=137 で別物)。
SuccessExitStatus=143
