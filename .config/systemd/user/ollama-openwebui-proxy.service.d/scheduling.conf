[Service]
Environment=OLLAMA_PROXY_MAX_GENERATIONS=3
Environment=OLLAMA_PROXY_MAX_BACKGROUND_GENERATIONS=2
Environment=OLLAMA_PROXY_MAX_BACKGROUND_QUEUE=20
Environment=OLLAMA_PROXY_INTERACTIVE_CONTEXT=65536
Environment=OLLAMA_PROXY_BATCH_CONTEXT=16384
Environment=OLLAMA_PROXY_INTERACTIVE_MODEL=qwen3.8:27b
Environment=OLLAMA_PROXY_BATCH_LIGHT_MODEL=gemma4:12b
Environment=OLLAMA_PROXY_BATCH_HEAVY_MODEL=qwen3.8:27b
Environment=OLLAMA_PROXY_EVICT_COMPETITORS=0
# OLLAMA_PROXY_INTERACTIVE_TARGETS はホスト固有 (evo-x2 だけワーカーを持つ) なので
# ここに置かず各ホストの ~/.env に書く (ats030-hqae)。未設定なら上流1本。
Environment=OLLAMA_PROXY_INTERACTIVE_STICKY_WAIT=5
Environment=OLLAMA_PROXY_INTERACTIVE_QUEUE_TIMEOUT=120
