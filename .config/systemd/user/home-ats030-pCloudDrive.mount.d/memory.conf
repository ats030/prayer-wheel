# rclone の暴走を rclone の中に閉じ込める。
# Jul 28 に前プロセスが 21.0G memory peak まで伸びて異常終了し、
# 'Unit process (rclone) remains running after unit stopped' の不完全停止を起こした。
# マシンの総メモリは30GBなので、この規模になると全サービスを巻き込む。
# 平常時のRSSは468MB(--vfs-cache-mode=full, 4日間稼働時点)なので、
# MemoryHigh で先に絞り、それでも伸びるなら MemoryMax で止める。
[Mount]
MemoryHigh=2G
MemoryMax=4G
