[project]
name = "ats030"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "arxiv>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.15.0",
    "diskcache>=5.6.3",
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "feedparser>=6.0.11",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "laya>=0.3.4",
    "lxml>=5.2.0",
    "markdown>=3.7",
    "ollama>=0.6.2",
    "pillow>=12.2.0",
    "pillow-heif>=1.4.0",
    "playwright>=1.55.0",
    "pydantic>=2.13.2",
    "pypdf>=6.10.2",
    "python-dateutil>=2.9.0",
    "python-frontmatter>=1.1.0",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.2",
    "readability-lxml>=0.8.1",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.50",
    "streamlit>=1.56.0",
    "trafilatura>=2.0.0",
    "tweepy>=4.16.0",
    "twscrape==0.19.1",
    "uvicorn>=0.46.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# ホーム直下で走らせると pCloudDrive (FUSE) まで収集して返ってこないので範囲を切る。
# 除外するもの: 自前の pyproject.toml を持つアプリ (別の uv プロジェクトなので
# それぞれのディレクトリで uv run pytest する)、および取り込みの searxng。
testpaths = ["app"]
norecursedirs = [
    "pCloudDrive", ".venv", "*.egg", "node_modules", "cache", "data",
    "searxng", "app-hub", "calendar-viewer", "writing", "x-analyzer", "x-post",
]
