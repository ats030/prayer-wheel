<html lang="ja">
<head>

  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">

<body>
  <a class="skip-link" href="#page-heading">本文へ</a>
  <header class="masthead"><a class="wordmark" href="/">タイムラインジェネレーター<span>Timeline Generator</span></a><nav class="masthead-nav" aria-label="ページ"><a class="quiet-link" href="/">年表を生成する</a></nav></header>
  <main class="app-main">
    <div class="page-head"><h1 id="page-heading" tabindex="-1">端末の年表</h1></div>
    <p class="help">保存先はこのブラウザです（最大100件・全体8MiB）。自動で共有・公開しません。別の端末やURLでは同じ保存内容を使えません。ブラウザデータの消去で失われるため、ファイルへ書き出して控えてください。</p>
    <p class="help">ローカル版と公開サイトの間で移す場合は、元の画面で「すべて書き出す」を選び、移動先で「ファイルから復元」を選んでください。</p>
    <div class="job-actions"><button id="local-export" class="text-button" type="button">すべて書き出す</button><label class="quiet-link" for="local-import">ファイルから復元</label><input id="local-import" type="file" accept="application/json,.json" aria-label="年表バックアップを選ぶ"></div>
    <p id="local-status" class="help" role="status"></p>
    <p id="local-error" class="error" role="alert" hidden></p>
    <p id="local-count" class="help"></p>
    <p id="local-empty" hidden>保存した年表はありません。年表の詳細で「この端末に保存」を押してください。</p>
    <div id="local-list"></div>
  </main>
