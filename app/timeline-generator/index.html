<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="キーワードから歴史を調べ、出典付きの年表で読む個人用アプリ。">
  <title>歴史年表</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
  <script src="http://ubuntu-server-app:8526/v.js" data-site="timeline-generator" defer></script>
</head>
<body>
  <a class="skip-link" href="#query">検索欄へ</a>
  <header class="masthead"><a class="wordmark" href="/">歴史年表<span>History Timeline</span></a><nav class="masthead-nav" aria-label="ページ"><a class="quiet-link" href="/timelines">年表一覧</a><a class="quiet-link" href="/changelog">更新履歴</a></nav></header>
  <main>
    <section class="search-section" aria-labelledby="search-heading">
      <div class="page-head"><h1 id="search-heading">年表を作る</h1></div>
      <form id="search-form" novalidate>
        <label class="sr-only" for="query">調べたいテーマ</label>
        <div class="search-row"><input id="query" name="query" type="text" maxlength="180" placeholder="半導体 日本 1980年以降" required aria-required="true" aria-describedby="query-help form-error" autocomplete="off"><button id="submit" type="submit">キューに追加<span aria-hidden="true"> →</span></button></div>
        <p class="error" id="form-error" role="alert" hidden></p>
      </form>

    </section>
    <section id="receipt" class="progress-section" hidden aria-labelledby="receipt-heading">
      <h2 id="receipt-heading">登録しました</h2>
      <p id="receipt-message" role="status"></p>
      <a id="receipt-link" class="quiet-link" href="/timelines">進捗・年表を見る →</a>
    </section>
    <details id="how" class="help-panel">
      <summary>使い方</summary>
      <div class="info-body">
        <p id="query-help">複数の言葉で絞り込めます。年代は「1980年以降」「1900〜2000年」「20世紀」のように指定します。</p>
        <div class="examples" aria-label="検索例"><button type="button" data-query="コーヒー">コーヒー</button><button type="button" data-query="インターネット">インターネット</button><button type="button" data-query="京都 1900年以降">京都 1900年以降</button></div>
        <p>登録順に一件ずつ、最大10分で生成します。画面を閉じても処理は続きます。同じテーマと期間の保存結果があれば再利用します。</p>
        <p>根拠を確認できた出来事を最大100件まで収録します。時間上限に達した場合は検証済みの結果を保存します。原文引用は表示せず、出典リンクから資料を確認できます。</p>
      </div>
    </details>
  </main>
</body>
</html>
