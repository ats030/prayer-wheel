tool: Cloudflare Workers shared UI routing
plan_or_version: Existing account and existing Wrangler 4.149.0; no paid upgrade
reviewed_at: 2026-10-12
status: conditional
cost:
  condition: Static assets have no additional charge. Dynamic routes count towards Workers usage; Free plan allows 100000 requests/day and 10ms CPU/invocation. No AI, database or paid add-on is enabled.
license:
  commercial_use: Existing Cloudflare service use remains subject to its subscription and application-service terms.
  cli: Existing Wrangler Apache-2.0 distribution retained.
conditions:
  - Only the previously published, hash-verified snapshot supplies public event data.
  - Missing source_mode remains unknown; old publication is not a new quality approval.
  - No private DB, Gemini key, auth token, generation backend or log storage is uploaded.
  - Public listing and detail stop polling when read-only, limiting Worker calls.
  - Access verification and VPC bridge code are prepared with existing JavaScript Web Crypto and Python standard libraries; no new SDK is installed.
  - Access and backend connection remain disabled pending permissions, Free-plan confirmation and a separately validated configuration.
  - VPC is currently free during open beta; recheck pricing before activation and when beta ends. No paid upgrade is authorized by this implementation.
adoption: approved_shared_ui_and_readonly_public_adapter
backend_preparation:
  status: conditional
  scope: Owner JWT verification and loopback gateway tested; one VPC Service targets existing tunnel and fixed gateway port; gateway and public backend binding remain inactive.
  condition: Owner completes Zero Trust Free onboarding and confirms plan; no paid subscription is created by the agent.
