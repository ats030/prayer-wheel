tool: Cloudflare Workers shared UI routing
plan_or_version: Existing account and existing Wrangler 4.149.0; no paid upgrade
reviewed_at: 2026-10-12
status: conditional
cost:
  condition: Static assets have no additional charge. Dynamic routes count towards Workers usage; Free plan allows 100000 requests/day and 10ms CPU/invocation. No hosted AI, database or paid add-on is added; the owner's existing local Python generator remains on the home server.
license:
  commercial_use: Existing Cloudflare service use remains subject to its subscription and application-service terms.
  cli: Existing Wrangler Apache-2.0 distribution retained.
conditions:
  - Only the previously published, hash-verified snapshot supplies public event data.
  - Missing source_mode remains unknown; old publication is not a new quality approval.
  - No private DB, Gemini key, Python generation backend or log storage is uploaded. Gateway authentication is kept in a Worker secret and a private local file.
  - Public listing and detail stop polling when read-only, limiting Worker calls.
  - Access verification and the active VPC bridge use existing JavaScript Web Crypto and Python standard libraries; no new SDK is installed.
  - Owner-only Access login, private history display and production VPC health forwarding are verified. Public viewers cannot access the generation API.
  - VPC is currently free during open beta; recheck pricing when beta ends. No paid upgrade is authorized by this implementation.
adoption: approved_shared_ui_and_owner_only_backend
backend_preparation:
  status: conditional
  scope: Owner JWT verification and loopback gateway tested; one active VPC Service targets the existing tunnel and fixed gateway port. Production health forwarding is verified by a protected diagnostic Worker. Real owner login, history display, generation, cancellation and regeneration are verified by the owner's production actions and local reflection reports.
  condition: Owner reported Zero Trust onboarding complete; account billing plan could not be independently verified by subscription API. No paid subscription is created or changed by the agent.
