[project]
name = "geo-map"
version = "0.1.0"
description = "Source of truth for geoparks and geological natural monuments used by midokoro-map"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests==2.32.5",
  "shapely==2.1.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
