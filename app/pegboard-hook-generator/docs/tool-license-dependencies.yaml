tool: 有孔ボードフック ジェネレータ (出品物そのもの)
plan_or_version: index.html 単体 (2026-08-17 時点)
reviewed_at: 2026-08-17
decision: approved
license: 自作 (第三者の素材・ライブラリを含まない)
commercial_use:
  allowed: true
  source: 自作物であり、他者の権利に由来する制限が無い
intended_use: 寸法を指定して有孔ボード用フックの STL を書き出す単一HTMLツール。BOOTH / Cults3D で販売する。
dependencies_checked:
  - item: 外部 JavaScript ライブラリ
    result: なし。index.html と verify.js に外部ホストへの参照が1件も無い (http/https のURL・@import・CDN 参照をいずれも検索して0件)。STL の生成もブラウザ内で自前実装している。
  - item: フォント・画像素材
    result: 埋め込みなし。表示はブラウザ既定のフォントに任せている。
  - item: 元の設計
    result: ~/pCloudDrive/CAD/PrintableFiles/Hook-1-* の自作パラメトリックモデル。第三者の設計に由来しない (ats030-y9fb.6 の「原設計」は自分の FreeCAD/STEP を指す)。
  - item: 有孔ボードの穴ピッチ等の寸法
    result: 工業的な事実であって著作物ではない。
restrictions:
  - 販売チャネル側の条件は別レコード。ai-workflow/tool-license-registry.yaml の BOOTH (pixiv) と Cults3D を参照する。
  - Cults の既定ライセンスは CULTS PU (私的利用のみ) で、買い手に印刷物の販売まで許すなら出品時に CULTS CU または CU-ND を明示的に選ぶ必要がある。既存出品がどれで出ているかは未棚卸し。
notes: >-
  外部依存を持たないことは、この商品の性質そのものでもある。サーバーを持たず維持費が
  かからない (ats030-y9fb) のは、生成をすべてブラウザ内で完結させているため。
  依存が増えるとその前提と許諾の両方が同時に崩れるので、ライブラリを足すときは
  ここを更新すること。
