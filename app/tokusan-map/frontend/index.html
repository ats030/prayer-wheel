<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>特産物マップ｜発祥地と産地から日本の特産を探す</title>
  <meta name="description" content="発祥地・産地から、日本各地の特産物 (食材・郷土料理・地域ブランド商品・工芸品・木材・花卉) を検索・地図表示できます。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="特産物マップ">
  <meta property="og:title" content="特産物マップ｜発祥地と産地から日本の特産を探す">
  <meta property="og:description" content="発祥地・産地から、日本各地の特産物 (食材・郷土料理・地域ブランド商品・工芸品・木材・花卉) を検索・地図表示できます。">
  <meta property="og:url" content="https://tokusan-map-736831430371.asia-northeast1.run.app/">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://tokusan-map-736831430371.asia-northeast1.run.app/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="">
  <link rel="stylesheet" href="/app.css?v=20261003c">
  <link rel="stylesheet" href="/detail-panel.css?v=202609298">
</head>
<body>
  <main class="app-shell">
    <section class="workbench" aria-label="特産物を探す">
      <header class="masthead"><h1>特産物マップ</h1><p class="lede">発祥地・産地から、日本各地の特産物を探せます。<a href="/changelog.html">更新履歴</a></p></header>
      <div class="filters" role="search">
        <label class="field field-wide">品目名・産地<input id="keyword" type="search" placeholder="例：桜島大根、熊本" autocomplete="off"></label>
        <label class="field field-wide">都道府県<select id="prefecture"><option value="">すべて</option></select></label>
        <div class="field field-wide"><span id="category-label">品目</span><details class="multi-select" id="category"><summary aria-labelledby="category-label category-summary"><span class="multi-summary" id="category-summary">すべて</span></summary><div class="multi-options" id="category-options" role="group" aria-labelledby="category-label"></div></details></div>
      </div>
      <div class="result-bar" aria-live="polite"><span><strong id="result-count">0</strong> 件の特産物</span><button id="clear-filters" type="button">条件をクリア</button></div>
      <div class="tokusan-list" id="tokusan-list"></div>
    </section>
    <section class="map-region" aria-label="特産物の地図"><div id="map"></div><div class="map-overlays"><div class="map-count" id="map-count">読み込み中</div><div class="map-legend" id="map-legend" role="list" aria-label="特産物の品目凡例"></div></div></section>
    <aside class="detail-panel" id="detail-panel" aria-labelledby="detail-panel-label" tabindex="-1" hidden>
      <header class="detail-header"><div><p class="eyebrow" id="detail-panel-label">特産物の詳細</p><p class="detail-origin" id="detail-origin"></p></div><button class="detail-close" type="button" aria-label="詳細を閉じる">×</button></header>
      <div class="detail-content" id="detail-content" aria-live="polite"></div>
    </aside>
  </main>
  <dialog id="lightbox" aria-label="特産物の画像"><button class="lightbox-close" type="button" aria-label="画像を閉じる">×</button><img id="lightbox-image" alt=""></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
  <script src="http://ubuntu-server-app:8526/v.js" data-site="tokusan-map" defer></script>
  <script src="/app.js?v=20261006a"></script>
</body>
</html>
