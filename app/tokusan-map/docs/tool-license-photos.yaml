tool: Wikimedia Commons individual photographs via MediaWiki APIs
version_or_plan: Public API and file metadata snapshot, 2026-09-29
category: dataset
status: conditional
license: Per-file CC-BY, CC-BY-SA, CC0, or public domain
commercial_use: permitted by the accepted individual licenses, subject to attribution
license_url: https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia
terms_url: https://www.mediawiki.org/wiki/API:Etiquette
pricing_url: null
free_condition: Public endpoints and file hotlinks; no paid API, key, or subscription
restrictions:
  - Keep each file's Commons source URL, author, credit, attribution, and exact license URL.
  - Only accept CC BY / BY-SA versions 1.0, 2.0, 2.5, 3.0, 4.0, reviewed Japanese CC BY / BY-SA 2.1 jp, or explicitly marked CC0/public domain.
  - Do not register NC, ND, unknown licenses, non-Commons local Wikipedia files, or CC files without an author.
  - Use the Commons thumbnail and the unmodified original of the same file as fallback; no edits or crops.
  - Share-alike conditions apply to future adaptations; re-review rights before adapting a file.
  - Preserve photographer credit, not merely the uploader's name.
  - Product association must be verified separately from licensing; generic redirect and regional dish mismatches are excluded.
  - Follow API maxlag, batching, retries, descriptive User-Agent and local response caching.
evidence:
  - https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia
  - https://creativecommons.org/licenses/by/4.0/
  - https://creativecommons.org/licenses/by-sa/4.0/
  - https://creativecommons.org/licenses/by-sa/2.1/jp/deed.en
  - https://creativecommons.org/publicdomain/zero/1.0/
  - https://www.mediawiki.org/wiki/API:Etiquette
evidence_retrieved: 2026-09-29
reviewer: Codex
notes: >-
  Reuses the existing Wikimedia source and existing requests/BeautifulSoup tooling.
  No new dependency or paid service is introduced. Adoption remains conditional
  because every added file requires its own rights and product-association review.
  File-level metadata and evidence URLs are stored in data/images.json.
  Expanded discovery includes article-body files, Commons category sitelinks,
  exact-label searches and English-label searches. A search match is not an
  approval: additions require an explicit product/file/evidence review in
  data/image_review.json. No generic brand or regional substitutes are published.
