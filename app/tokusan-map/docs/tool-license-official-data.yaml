tool: Japanese government regional-product information
version_or_plan: Web snapshots retrieved 2026-09-29
category: dataset
status: conditional
license: PDL-1.0
commercial_use: permitted subject to attribution and third-party rights
license_url: https://www.digital.go.jp/resources/open_data/public_data_license_v1.0
terms_url: https://www.maff.go.jp/j/use/link.html
pricing_url: null
restrictions:
  - Link each item to its actual official source and identify the publisher.
  - Mark edited descriptions as edited; do not imply government endorsement.
  - This metadata review does not authorize photographs, third-party recipes, logos, or GI marks.
  - Explicitly permitted recipe ZIP photos require the separate tool-license-maff-photos.yaml review.
  - History text is limited to the 「歴史・由来・関連行事」 (うちの郷土料理) and
    「歴史・文化、関連行事」 (にっぽん伝統食図鑑) sections, shown verbatim per paragraph
    with the source link, 「出典をもとに編集」 and PDL1.0. Sections citing third-party
    material (資料：/出典：/提供：/引用：) are skipped. Recipes and 飲食方法 are excluded.
  - Forestry text follows https://www.rinya.maff.go.jp/tohoku/use/link.html
  - METI text follows https://www.meti.go.jp/main/rules.html
evidence_retrieved: 2026-09-29
reviewer: Codex
notes: >-
  Public pages have no access fee. PDL1.0 explicitly permits commercial reuse.
  This catalog extracts names, production areas, classifications and ingredients,
  with short edited descriptions. Images and recipe instructions are excluded.
  Each record preserves its source URL and verification date. This is a conditional
  adoption because rights notices must be rechecked when adding other content.
  Rechecked 2026-09-30 for history text: link.html still applies PDL1.0, and
  bessi.html excludes only YouTube, クッキング自給率 and 食事バランスガイド, not the
  郷土料理 or 伝統食図鑑 pages. GI pages keep history only in specification PDFs
  and are out of scope.
