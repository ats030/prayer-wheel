notes: >-
  The official recipe page expressly permits use of ZIP-downloadable photographs.
  This is a specific permission, separate from the default warning about third-party
  images in MAFF's general terms. PDL1.0 permits commercial reproduction and public
  transmission with attribution. Only files with individual-page permission evidence
  enter the registry; unknown rights and non-ZIP photos remain excluded.

  Both reviewed notices require a real ZIP link in the exact image box. The newer
  notice expressly requires the named third-party provider credit as well as MAFF
  attribution; the importer preserves that box credit. Pages that only prohibit
  unauthorized use, even with ZIP links, remain excluded. Heading levels h2/h3
  vary but the same prefecture and dish identity checks apply.
