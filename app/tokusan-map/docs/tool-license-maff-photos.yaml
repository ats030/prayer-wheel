restrictions:
  - A site's general open-data terms alone do not authorize third-party photographs.
  - Only ZIP files explicitly marked reusable without permission on the exact product page qualify.
  - Never adopt the separate non-downloadable photographs credited to third parties.
  - Verify dish, prefecture, image alt text, official source URL, and permission for every item.
  - Record the permission page, ZIP URL, retrieval date, hashes, archive member, and attribution.
  - Keep the original downloaded image unchanged; no crops, edits, or generated substitutes.
  - Display MAFF source and PDL1.0 links; retain any credit attached to the ZIP image.
  - Do not imply MAFF endorses this application.
