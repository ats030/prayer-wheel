tool: Nominatim public API
provider: OpenStreetMap Foundation
reviewed_at: 2026-09-11
decision: conditional
cost: Free public service on donated infrastructure; no SLA.
commercial_use: Not prohibited, but the policy warns commercial applications that access may be withdrawn.
data_license: ODbL 1.0
conditions:
  - Maximum one request per second across the application.
  - Send an identifying User-Agent or Referer.
  - Display OpenStreetMap attribution.
  - Cache results and avoid repeated or systematic requests.
  - Keep the provider switchable without a software release.
implementation:
  rate_limit: Server serializes requests at one-second intervals.
  trigger: One reverse lookup after an end user selects a festival.
  cache: Browser localStorage cache keyed by rounded coordinates; concurrent requests are shared.
  attribution: Existing Leaflet map attribution links to OpenStreetMap copyright.
  provider_switch: NOMINATIM_BASE_URL environment variable.
  identification: NOMINATIM_USER_AGENT environment variable with a repository-identifying default.
sources:
  usage_policy: https://operations.osmfoundation.org/policies/nominatim/
  license: https://www.openstreetmap.org/copyright
