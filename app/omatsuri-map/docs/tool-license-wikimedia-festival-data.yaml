tool: Wikimedia festival data import
provider: Wikimedia Foundation
reviewed_at: 2026-09-11
decision: conditional
cost: Public APIs are free to use, without an SLA.
commercial_use: Permitted under the applicable content licenses.
data_license: Wikidata structured data is CC0 1.0; Japanese Wikipedia text is CC BY-SA 4.0.
conditions:
  - Use Japanese Wikipedia category membership only to discover candidate pages.
  - Publish names, descriptions, coordinates, and identifiers from Wikidata CC0 data.
  - Keep a Wikipedia article link for provenance and attribution.
  - Send an identifying User-Agent and use batched, sequential API requests.
  - Stop and retry with backoff when Wikimedia returns 429 or a transient server error.
implementation:
  trigger: Manual, build-time import; no runtime API dependency.
  batching: Up to 50 entities per request with no parallel requests.
  identification: OmatsuriMap User-Agent with repository URL.
  provenance: Each imported record stores its Wikipedia title and Wikidata QID.
  recurring_dates: >-
    P837 (day in year for periodic occurrence) is resolved through its linked
    calendar item. Exact month/day and nth/last weekday rules are retained with
    a link to the source statement; month-only and lunar-calendar values are
    omitted rather than guessed.
sources:
  wikidata_license: https://www.wikidata.org/wiki/Wikidata:Licensing
  wikidata_access: https://www.wikidata.org/wiki/Wikidata:Data_access/en
  api_limits: https://www.mediawiki.org/wiki/Wikidata_Query_Service/User_Manual
  wikimedia_terms: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
  api_guidelines: https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_API_Usage_Guidelines/en
