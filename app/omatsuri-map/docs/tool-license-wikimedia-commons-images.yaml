tool: Wikimedia Commons image reuse
provider: Wikimedia Foundation and individual media creators
reviewed_at: 2026-09-11
decision: conditional
cost: Public APIs and hosted media access are free, without an SLA.
commercial_use: Permitted only under each file's stated license and applicable non-copyright restrictions.
data_license: Each media file has its own license; structured file metadata is CC0.
conditions:
  - Display the supplied author or attribution party when Commons marks attribution as required.
  - Display the license name with a link to its terms and link to the Commons file description page.
  - Do not display a file when its license is missing, or when attribution is required and the artist is missing.
  - Treat Commons metadata as provenance, not a warranty of copyright status.
  - Do not imply endorsement; review trademark, personality, privacy, and moral-right restrictions when relevant.
implementation:
  source_of_truth: Wikimedia Commons imageinfo extmetadata for the selected Wikidata P18 file.
  displayed_fields: Artist, LicenseShortName or License, LicenseUrl, and descriptionurl.
  safety: Artist HTML is converted to plain text in the browser; external URLs allow only HTTP(S).
  rollback: Remove attribution metadata enrichment and stop displaying Commons images.
sources:
  reuse_guidance: https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia/en
  license_guidance: https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia/licenses/en
  credit_line_metadata: https://commons.wikimedia.org/wiki/Commons:Credit_line/en
  creative_commons_licenses: https://creativecommons.org/share-your-work/use-remix/cc-licenses/
