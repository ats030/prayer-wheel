<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omatsuri Map & Calendar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="http://ubuntu-server-app:8526/v.js" data-site="omatsuri-map-integrated" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; margin: 0; height: 100vh; }
        iframe { border: none; height: 100%; }
        #map { flex: 3; }  /* 60% */
        #calendar { flex: 2; }  /* 40% */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            iframe { flex: 1!important; }
        }
    </style>
</head>
<body>
    <iframe id="map" src="http://localhost:8527/" title="Omatsuri Map"></iframe>
    <iframe id="calendar" src="http://localhost:8500/" title="Calendar Viewer"></iframe>
</body>
</html>
