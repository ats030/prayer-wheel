<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail panel states</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/detail-panel.css"><style>body{height:auto;padding:var(--space-lg)}.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,19rem));gap:var(--space-md)}.preview .detail-panel{display:block;border:1px solid var(--color-rule)}.preview-label{color:var(--color-ink-2);font-size:.75rem}</style></head><body><h1>詳細パネル — 状態確認</h1><main class="preview" id="preview"></main><script>const states=['default','hover','focus','active','disabled','loading','error','success'];document.querySelector('#preview').innerHTML=states.map(state=>`<section><p class="preview-label">${state}</p><aside class="detail-panel"><header class="detail-header"><p class="eyebrow">祭りの詳細</p><button class="detail-close is-${state}" ${state==='disabled'?'disabled':''}>×</button></header><div class="detail-content" data-state="${state}"><article class="detail"><header class="detail-lead"><h2>青森ねぶた</h2></header><dl class="detail-facts"><div><dt>開催地</dt><dd>青森県</dd></div><div><dt>開催日</dt><dd>日付未定</dd></div></dl><section class="detail-section"><h3>祭りについて</h3><p class="detail-description">詳細本文の読みやすさと状態を確認します。</p></section></article></div></aside></section>`).join('')</script></body></html>
