<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail panel states</title><link rel="stylesheet" href="/app.css"><style>.detail-close.is-focus{outline:3px solid var(--color-focus);outline-offset:2px}body{height:auto;padding:var(--space-lg)}.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,19rem));gap:var(--space-md)}.preview .detail-panel{display:block;border:1px solid var(--color-rule)}.preview-label{margin:0;padding:var(--space-xs);color:var(--color-ink-2);font-size:.75rem}</style></head>
<body><h1>詳細パネル — 状態確認</h1><main class="preview" id="preview"></main><script>const states=['default','hover','focus','active','disabled','loading','error','success'];document.querySelector('#preview').innerHTML=states.map(state=>`<section><p class="preview-label">${state}</p><aside class="detail-panel"><header class="detail-header"><p class="eyebrow">祭りの詳細</p><button class="detail-close is-${state}" ${state==='disabled'?'disabled':''}>×</button></header><div class="detail-content" data-state="${state}"><article class="detail"><h2>青森ねぶた</h2><p class="detail-meta">青森県 · 日付未定</p><p class="detail-description">詳細本文の表示状態を確認します。</p></article></div></aside></section>`).join('')</script></body>
</html>
