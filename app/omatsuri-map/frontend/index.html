<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omatsuri Map & Calendar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="http://ubuntu-server-app:8526/v.js" data-site="omatsuri-map" defer></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; margin: 0; height: 100vh; }
        * { cursor: auto !important; }
        #map-container { flex: 7; height: 100%; width: 100%; }  /* 70% */
        #calendar-section { flex: 3; height: 100%; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; background: #f5f5f5; }  /* 30% */
        #map { width: 100%; height: 100%; }
        .calendar-link-container {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
        }
        .calendar-link-container p {
            margin-bottom: 1rem;
            color: #666;
            font-size: 1rem;
        }
        .calendar-link-container a {
            padding: 0.8rem 1.5rem;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .calendar-info {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
        }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #map-container { flex: 1; }
            #calendar-section { flex: 1; }
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
    </div>
    <div id="calendar-section">
        <iframe id="calendar-frame" src="calendar.html" style="flex: 1; border: none; width: 100%;"></iframe>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize map
        var map = L.map('map').setView([35.68, 139.69], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Festival markers
        var markers = [];

        // Fetch festival data
        fetch('festivals-with-date.json')
            .then(response => response.json())
            .then(data => {
                renderMarkers(data);
            })
            .catch(err => {
                console.error('Error loading festivals:', err);
                const sampleData = [
                    { "qid": "Q929531", "label_ja": "さっぽろ雪まつり", "label_en": "Sapporo Snow Festival", "prefecture": "北海道", "latitude": 43.061047, "longitude": 141.35638, "date": "日付未定" },
                    { "qid": "Q862407", "label_ja": "青森ねぶた", "label_en": "Aomori Nebuta Matsuri", "prefecture": "青森県", "latitude": 40.822342, "longitude": 140.74739, "date": "日付未定" },
                    { "qid": "Q114712", "label_ja": "長崎くんち", "label_en": "Nagasaki Kunchi", "prefecture": "長崎県", "latitude": 32.754125, "longitude": 129.88211111, "date": "日付未定" }
                ];
                renderMarkers(sampleData);
            });

        // Parse date range from date string
        function parseDateRange(dateStr) {
            if (dateStr === "日付未定") return { start: null, end: null };
            const parts = dateStr.split("〜");
            return {
                start: parts[0] ? new Date(parts[0] + "T00:00:00") : null,
                end: parts[1] ? new Date(parts[1] + "T00:00:00") : null
            };
        }

        // Check if festival is active on target date
        function isFestivalActive(festival, targetDate) {
            if (targetDate === null) return true;
            const { start, end } = parseDateRange(festival.date);
            if (!start || !end) return false;
            return targetDate >= start && targetDate <= end;
        }

        // Render markers on map
        function renderMarkers(festivals, targetDate = null) {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            const filtered = festivals.filter(f => {
                const { start, end } = parseDateRange(f.date);
                if (targetDate === null) {
                    return start !== null && end !== null;
                }
                if (!start || !end) return false;
                return targetDate >= start && targetDate <= end;
            });

            filtered.forEach(festival => {
                const marker = L.marker([festival.latitude, festival.longitude]).addTo(map);
                
                const wikidataUrl = `https://www.wikidata.org/wiki/${festival.qid}`;
                const wikipediaUrl = `https://ja.wikipedia.org/wiki/${festival.qid}`;
                
                let popupContent = `
                    <div style="padding: 10px;">
                        <h3 style="margin: 0 0 5px 0; font-size: 16px;">${festival.label_ja}</h3>
                        <p style="margin: 0 0 5px 0; color: #666;">${festival.label_en}</p>
                        <p style="margin: 0 0 5px 0; color: #666;">${festival.prefecture}</p>
                        <p style="margin: 0 0 5px 0; color: #666;">${festival.date}</p>
                        <div style="margin-top: 8px; font-size: 12px;">
                            <a href="${wikidataUrl}" target="_blank">Wikidata</a> | 
                            <a href="${wikipediaUrl}" target="_blank">Wikipedia</a>
                        </div>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markers.push(marker);
            });
        }

        window.renderMapMarkers = renderMarkers;
    </script>
</body>
</html>
