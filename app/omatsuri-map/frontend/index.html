<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>日本のお祭り地図</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="app-shell">
    <section class="workbench" aria-label="祭りを探す">
      <header class="masthead"><p class="eyebrow">Omatsuri Map</p><h1>日本のお祭り地図</h1><p class="lede">地域と開催日から、各地の祭りを探せます。</p></header>
      <div class="filters" role="search">
        <label class="field field-wide">祭り名・地域<input id="keyword" type="search" placeholder="例：ねぶた、青森" autocomplete="off"></label>
        <label class="field">都道府県<select id="prefecture"><option value="">すべて</option></select></label>
        <label class="field">開催日<input id="festival-date" type="date"></label>
      </div>
      <div class="result-bar" aria-live="polite"><span><strong id="result-count">0</strong> 件の祭り</span><button id="clear-filters" type="button">条件をクリア</button></div>
      <div class="festival-list" id="festival-list"></div>
    </section>
    <section class="map-region" aria-label="祭りの地図"><div id="map"></div><div class="map-count" id="map-count">読み込み中</div></section>
  </main>
  <dialog id="lightbox" aria-label="祭りの画像"><button class="lightbox-close" type="button" aria-label="画像を閉じる">×</button><img id="lightbox-image" alt=""></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="http://ubuntu-server-app:8526/v.js" data-site="omatsuri-map" defer></script>
  <script src="/app.js"></script>
</body>
</html>
