<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>お祭りマップ｜地域と開催日から各地の祭りを探す</title>
  <meta name="description" content="地域と開催日から、各地の祭りを検索・地図表示できます。お出かけ前に開催時期や場所を確認できます。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="お祭りマップ">
  <meta property="og:title" content="お祭りマップ｜地域と開催日から各地の祭りを探す">
  <meta property="og:description" content="地域と開催日から、各地の祭りを検索・地図表示できます。お出かけ前に開催時期や場所を確認できます。">
  <meta property="og:url" content="https://omatsuri-map-736831430371.asia-northeast1.run.app/">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://omatsuri-map-736831430371.asia-northeast1.run.app/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/app.css?v=20261003b">
  <link rel="stylesheet" href="/detail-panel.css?v=20260923">
</head>
<body>
  <main class="app-shell">
    <section class="workbench" aria-label="祭りを探す">
      <header class="masthead"><h1>お祭りマップ</h1><p class="lede">地域と開催日から、各地の祭りを探せます。<a href="/changelog.html">更新履歴</a></p></header>
      <div class="filters" role="search">
        <label class="field field-wide">祭り名・地域<input id="keyword" type="search" placeholder="例：ねぶた、青森" autocomplete="off"></label>
        <label class="field field-wide">都道府県<select id="prefecture"><option value="">すべて</option></select></label>
        <div class="field field-wide"><span id="category-label">種類</span><details class="multi-select" id="category"><summary aria-labelledby="category-label category-summary"><span class="multi-summary" id="category-summary">すべて</span></summary><div class="multi-options" id="category-options" role="group" aria-labelledby="category-label"></div></details></div>
        <label class="field field-wide date-range-field">開催期間<span class="date-range"><input id="festival-date-start" type="date" aria-label="開催期間の開始日"><span class="date-range-sep" aria-hidden="true">〜</span><input id="festival-date-end" type="date" aria-label="開催期間の終了日"></span></label>
      </div>
      <div class="result-bar" aria-live="polite"><span><strong id="result-count">0</strong> 件の祭り</span><button id="clear-filters" type="button">条件をクリア</button></div>
      <div class="festival-list" id="festival-list"></div>
    </section>
    <section class="map-region" aria-label="祭りの地図"><div id="map"></div><div class="map-count" id="map-count">読み込み中</div><div class="map-legend" id="map-legend" role="list" aria-label="祭りの種類凡例"></div></section>
    <aside class="detail-panel" id="detail-panel" aria-labelledby="detail-panel-label" tabindex="-1" hidden>
      <header class="detail-header"><div><p class="eyebrow" id="detail-panel-label">祭りの詳細</p><p class="detail-origin" id="detail-origin">選択中の祭り</p></div><button class="detail-close" type="button" aria-label="詳細を閉じる">×</button></header>
      <div class="detail-content" id="detail-content" aria-live="polite"></div>
    </aside>
  </main>
  <dialog id="lightbox" aria-label="祭りの画像"><button class="lightbox-close" type="button" aria-label="画像を閉じる">×</button><img id="lightbox-image" alt=""></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="http://ubuntu-server-app:8526/v.js" data-site="omatsuri-map" defer></script>
  <script src="/app.js?v=20261003b"></script>
</body>
</html>
