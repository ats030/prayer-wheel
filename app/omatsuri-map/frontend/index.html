<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omatsuri Map & Calendar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="http://ubuntu-server-app:8526/v.js" data-site="omatsuri-map" defer></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; margin: 0; height: 100vh; }
        #map-container { flex: 7; height: 100%; width: 100%; }  /* 70% */
        #calendar-section { flex: 3; height: 100%; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; background: #f5f5f5; }  /* 30% */
        #map { width: 100%; height: 100%; }
        .calendar-link-container {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
        }
        .calendar-link-container p {
            margin-bottom: 1rem;
            color: #666;
            font-size: 1rem;
        }
        .calendar-link-container a {
            padding: 0.8rem 1.5rem;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .calendar-info {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
        }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #map-container { flex: 1; }
            #calendar-section { flex: 1; }
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
    </div>
    <div id="calendar-section">
        <div class="calendar-link-container">
            <p>カレンダーで予定を確認</p>
            <a href="http://100.94.207.13:8515/" target="_blank">カレンダーを開く</a>
        </div>
        <p class="calendar-info">新しいタブでカレンダーを開きます</p>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize map
        var map = L.map('map').setView([35.68, 139.69], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
    </script>
</body>
</html>
