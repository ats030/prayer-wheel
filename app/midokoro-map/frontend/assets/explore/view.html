<main class="app-shell">
  <label class="mobile-place">行きたい都道府県<select id="mobile-prefecture"><option value="">全国</option></select></label>
  <section class="workbench" aria-label="地域からみどころを探す">
    <header class="masthead"><p class="eyebrow">地域から探す</p><h2>次の寄り道を見つける。</h2><p class="lede">地域を選んで、史跡、温泉、祭りや自然をひとつの地図で。</p></header>
    <div class="filters" role="search">
      <label class="field field-wide">行きたい都道府県<select id="prefecture"><option value="">全国</option></select></label>
      <label class="field field-wide">名称・地域<input id="keyword" type="search" placeholder="例：草津、阿蘇、城" autocomplete="off"></label>
      <label class="field field-wide">見たいもの<select id="category"><option value="">すべてのカテゴリ</option><option value="shiseki">史跡・名勝</option><option value="omatsuri">祭り</option><option value="onsen">温泉</option><option value="tokusan">特産物</option><option value="geo">地形・地質</option></select></label>
    </div>
    <div class="result-bar"><span aria-live="polite"><strong id="result-count">0</strong> 件</span><button id="clear-filters" type="button">条件をクリア</button></div>
    <p id="search-summary">都道府県を選ぶか、地図を動かして探せます。</p>
    <p id="explore-status" role="status">みどころを読み込んでいます…</p>
    <button id="explore-retry" type="button" hidden>読み込めなかったカテゴリを再試行</button>
    <p id="explore-empty" hidden>条件に合うみどころがありません。範囲を広げるか、検索条件を減らしてください。</p>
    <nav id="area-choices" aria-label="重なる範囲から選ぶ" hidden></nav>
    <div id="explore-list"></div>
    <button id="show-more" type="button" hidden>さらに表示</button>
  </section>
  <section class="map-region" aria-label="地域のみどころの地図">
    <div id="map"></div>
    <div class="map-count" id="map-count">読み込み中</div>
    <div class="map-search"><button id="search-area" type="button">この範囲で探す</button><button id="clear-area" type="button" hidden>範囲の絞り込みを解除</button></div>
    <div class="map-legend" aria-label="みどころの凡例"><span><i style="background:var(--kind-shiseki)"></i>史跡・名勝</span><span><i style="background:var(--kind-omatsuri)"></i>祭り</span><span><i style="background:var(--kind-onsen)"></i>温泉</span><span><i style="background:var(--kind-tokusan)"></i>特産物</span><span><i style="background:var(--geo-geosite)"></i>天然記念物</span><span><i class="area"></i>ジオパークの範囲</span><span><i class="area nationalpark"></i>国立公園の区域</span></div>
  </section>
</main>
