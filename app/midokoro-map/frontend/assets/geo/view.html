<main class="app-shell">
  <section class="workbench" aria-label="地形・地質を探す">
    <header class="masthead"><h2>地形・地質</h2><p>ジオパークと地質鉱物の天然記念物を探せます。</p></header>
    <div class="filters" role="search">
      <label>名称・地域<input id="keyword" type="search" placeholder="例：阿蘇、洞窟、熊本" autocomplete="off"></label>
      <label>種別<select id="geo-type"><option value="">すべて</option><option value="geopark">ジオパーク</option><option value="geosite">天然記念物（地質鉱物）</option></select></label>
    </div>
    <div class="result-bar"><span aria-live="polite"><strong id="result-count">0</strong> 件</span><button id="clear-filters" type="button">条件をクリア</button></div>
    <p id="geo-message" role="status"></p><button id="geo-retry" type="button" hidden>再試行</button>
    <p id="geo-empty" hidden>条件に一致する地点・範囲はありません。</p>
    <div id="geo-list"></div>
  </section>
  <section class="map-region" aria-label="地形・地質の地図"><div id="map"></div><div class="map-count" id="map-count">読み込み中</div></section>
</main>
