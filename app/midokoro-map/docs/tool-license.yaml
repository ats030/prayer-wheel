reviewed: 2026-10-06
scope: Existing pinned dependencies and existing data reused; no new paid service.
decisions:
  - name: Leaflet
    version: 1.9.4
    license: BSD-2-Clause
    commercial_use: permitted_with_notice
    cost: free
    source: https://github.com/Leaflet/Leaflet/blob/v1.9.4/LICENSE
    notice: frontend/vendor/leaflet-LICENSE
  - name: Leaflet.markercluster
    version: 1.5.3
    license: MIT
    commercial_use: permitted_with_notice
    cost: free
    source: https://github.com/Leaflet/Leaflet.markercluster/blob/v1.5.3/MIT-LICENCE.txt
    notice: frontend/vendor/markercluster-LICENSE
  - name: modernc.org/sqlite
    version: v1.29.10
    license: BSD-3-Clause
    commercial_use: permitted_with_notice
    cost: free
    source: https://gitlab.com/cznic/sqlite/-/blob/v1.29.10/LICENSE
    notice: docs/sqlite-LICENSE
  - name: OpenStreetMap standard tiles
    cost: No charge; best effort, no availability guarantee
    conditions: Visible attribution; normal interactive viewing; no bulk download or prefetch; respect caching and browser Referer.
    source: https://operations.osmfoundation.org/policies/tiles/
  - name: Google Cloud Run
    cost: Existing billed project; usage-based, not guaranteed free
    conditions: Scale to zero, at most two instances; replaces four services after verification.
  - name: Existing map data and photos
    conditions: Existing provenance, attribution and per-image license fields retained without adding a dataset; source collection remains in original apps.
