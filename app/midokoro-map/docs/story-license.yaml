reviewed: 2026-10-07
scope: Three editorial theme pages; no new dependency or imported third-party dataset.
decisions:
  - name: Existing Leaflet
    version: 1.9.4
    status: approved
    license: BSD-2-Clause
    commercial_use: permitted_with_notice
    cost: free
    source: https://github.com/Leaflet/Leaflet/blob/v1.9.4/LICENSE
    notice: frontend/vendor/leaflet-LICENSE
  - name: Existing OpenStreetMap standard tiles
    status: conditional
    commercial_use: subject_to_tile_policy_and_attribution
    cost: No charge for permitted normal interactive viewing; no availability guarantee.
    source: https://operations.osmfoundation.org/policies/tiles/
    conditions: Visible OSM attribution, HTTPS tile.openstreetmap.org URL, normal browser caching and Referer; no offline download, prefetch or bulk requests.
  - name: Arita editorial sources
    status: approved
    intended_use: Independent original descriptions of facts, five representative coordinates and direct source links.
    cost: Public sources read without paid API or account.
    commercial_use: No licensed prose, photos or map imagery reproduced; factual reference only.
    conditions: Retain source links, retrieval date, coordinate precision and uncertainty. Do not treat this decision as permission to reproduce third-party works.
    sources:
      - https://www.arita.jp/spot/
      - https://www.town.arita.lg.jp/rekishi/kiji003812/index.html
      - https://www.town.arita.lg.jp/kiji0031926/index.html
      - https://online.bunka.go.jp/heritages/detail/163981
  - name: Existing Cloud Run hosting and request logs
    status: conditional
    cost: Existing billed project; not guaranteed free. No new service or retention setting.
    conditions: Use existing deployment configuration and existing logging access; anonymous counts do not establish unique people or conversion.
  - name: Kusatsu and Kawagoe editorial sources
    status: approved
    intended_use: Original factual summaries, ten representative points and source links; no imported prose, photos or dataset.
    cost: Public sources read without paid API or account.
    commercial_use: Factual reference only; no reproduction license claimed.
    conditions: Preserve source links, checked date, approximate point precision and distinction between evidence and thematic comparison.
    sources:
      - https://www.kusatsu-onsen.ne.jp/netsunoyu/history.html
      - https://www.kusatsu-onsen.ne.jp/kankou/1004.php
      - https://onsen-kusatsu.com/gozanoyu/
      - https://onsen-kusatsu.com/ohtakinoyu/hot-spring/
      - https://onsen-kusatsu.com/sainokawara/hot-spring/
      - https://koedo.or.jp/spot_001/
      - https://koedo.or.jp/spot_002/
      - https://koedo.or.jp/spot_007/
      - https://koedo.or.jp/spot_008/
      - https://www.kawagoematsuri.jp/about/about_history.html
      - https://kawagoematsuri.jp/matsurimuseum/
