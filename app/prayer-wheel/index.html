<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Prayer Wheel · 音声マニ車</title>
  <link rel="stylesheet" href="style.css">
  <script src="http://ubuntu-server-app:8526/v.js" data-site="prayer-wheel" defer></script>
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="eyebrow">Prayer Wheel · 音声マニ車</p>
        <h1>転じて読める</h1>
      </div>
      <p class="tagline">ホイールを回すようにスクロールすると、ひとつの節が声になる。クリックと矢印キーでも操作できます。</p>
    </header>

    <div class="voice-banner" id="voiceBanner" hidden>
      この端末には日本語ボイスが確認できません。システム既定の音声で読み上げますが、発音の質が低下する可能性があります。
    </div>

    <main class="grid">
      <section class="panel stage-panel" aria-label="マニ車">
        <div class="stage" id="stage" tabindex="0" role="button"
             aria-label="マニ車。スクロール、クリック、下矢印で次の節を読み上げ、上矢印でひとつ戻ります。">
          <div class="wheel">
            <svg id="dial" viewBox="0 0 400 400" aria-hidden="true">
              <defs>
                <path id="rimPath" d="M 200 32 a 168 168 0 1 1 -0.01 0"></path>
              </defs>
              <circle class="c-rim-outer" cx="200" cy="200" r="192"/>
              <circle class="c-rim-track" cx="200" cy="200" r="168"/>
              <circle class="c-rim-inner" cx="200" cy="200" r="148"/>
              <text class="rim-text"><textPath href="#rimPath" id="rimTextPath"></textPath></text>
              <g id="spokes"></g>
              <g id="petals"></g>
              <circle class="c-hub" cx="200" cy="200" r="58"/>
              <circle class="c-hub-rim" cx="200" cy="200" r="44"/>
              <circle class="c-mark" cx="200" cy="32" r="3"/>
            </svg>
            <div class="hub-counter">
              <span class="counter-num" id="counter">0</span>
              <span class="counter-label">回転</span>
            </div>
          </div>
        </div>
        <p class="stage-hint">スクロール／クリック: 次へ &nbsp;・&nbsp; 上へスクロール: 戻す &nbsp;・&nbsp; キー ↓ / ↑</p>
      </section>

      <section class="panel read-panel" aria-label="読み上げ本文">
        <div class="statusline">
          <span class="dot" id="statusDot"></span>
          <span class="status-text" id="statusText">準備完了</span>
          <span class="rounds">回 <b id="rounds">0</b></span>
        </div>

        <blockquote class="current" id="currentLine">—</blockquote>

        <div class="text-block" id="textBlock"></div>

        <div class="progress" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        <p class="progress-label" id="progressLabel">—</p>

        <div class="controls">
          <div class="control-row">
            <label class="field">
              <span>音声</span>
              <select id="voiceSelect" disabled></select>
            </label>
            <label class="field">
              <span>速度 <b id="rateOut">1.0×</b></span>
              <input type="range" id="rate" min="0.6" max="1.4" step="0.05" value="1">
            </label>
          </div>
          <div class="control-row">
            <button class="btn btn-primary" id="restartBtn">最初からやり直す</button>
            <button class="btn" id="pauseBtn" disabled>一時停止</button>
            <button class="btn" id="sutraBtn">心経を使う</button>
            <label class="btn file-btn">お経のテキストを読む (txt)
              <input type="file" id="file" accept=".txt,text/plain" hidden>
            </label>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <p>読み上げはブラウザ内蔵の音声合成 (Web Speech API) を使用します。テキストは端末を離れません。</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
