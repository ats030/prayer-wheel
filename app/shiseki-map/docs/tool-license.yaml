reviewed_at: 2026-09-23
decision: conditional
decision_note: existing Wikidata use remains approved; new public datasets require per-source publication gates
intended_use: public read-only historical-site map, including commercial affiliate links
sources:
  - name: Wikidata structured data
    cost: free
    license: CC0-1.0
    commercial_use: allowed
    attribution: not required by CC0; source links retained for provenance
    evidence: https://www.wikidata.org/wiki/Wikidata:Licensing
  - name: Japanese Database of National Cultural Properties text
    cost: free
    license: MEXT website terms
    commercial_use: allowed with attribution
    attribution: required
    restriction: images require separate permission and are not copied
    evidence: https://kunishitei.bunka.go.jp/top/policy
  - name: Wikimedia Commons images
    cost: free
    license: per-file license
    commercial_use: only when the per-file license permits it
    attribution: author, license and source shown per image
    restriction: omit images without machine-verifiable license metadata
  - name: Japan Search metadata API
    cost: free
    license: per-contributing-database metadata terms
    commercial_use: conditional
    attribution: preserve the contributing database and source record attribution
    restriction: ingest only databases and fields explicitly enabled for API reuse; recheck before release
    evidence: https://jpsearch.go.jp/static/developer/webapi/ch1_intro.html
  - name: Tokyo Metropolitan Government designated cultural properties CSV
    cost: free
    license: CC-BY-4.0
    commercial_use: allowed
    attribution: Tokyo Metropolitan Government and dataset link required
    restriction: only site-class records with valid coordinates and verified access are publication candidates
    decision: conditional
    published_record_ids: ["0000000114", "0000000115", "0000000243", "0000000186"]
    publication_note: four individually checked records only; the 2019 access hours are not republished; the Fuchu site uses Fuchu City open-data coordinates instead of the Tokyo CSV coordinates
    evidence: https://catalog.data.metro.tokyo.lg.jp/dataset/t000021d0000000017
  - name: Fuchu City open-data cultural property list
    cost: free download
    license: CC-BY-4.0
    commercial_use: allowed
    attribution: Fuchu City, dataset link, and modification notice required
    restriction: use only the individually verified Fuchu Kosatsuba row; confirm visit guidance separately
    decision: approved
    published_record_ids: ["0000000018"]
    evidence: https://www.city.fuchu.tokyo.jp/gyosei/opendata/index.html
    license_evidence: https://creativecommons.org/licenses/by/4.0/deed.ja
  - name: Tokyo Board of Education cultural walk map JSON
    cost: free to read
    license: website site policy; reuse permission not granted
    commercial_use: blocked for copying the map data into the affiliate-supported site
    attribution: not sufficient to override the site policy
    restriction: do not publish its coordinates or copy its descriptive content; use only as a read-only cross-check
    decision: blocked
    evidence: https://www.syougai.metro.tokyo.lg.jp/riyou/policy.html
  - name: Okinawa Prefecture cultural properties CSV (2025-05)
    cost: free
    license: CC-BY-4.0
    commercial_use: allowed
    attribution: Okinawa Prefecture and dataset link required
    restriction: most historic-site rows lack coordinates; verify access and coordinates per record
    decision: conditional
    evidence: https://data.bodik.jp/dataset/470007_bunkazai
  - name: Hokkaido archaeological sites GIS
    cost: free
    license: CC-BY-4.0
    commercial_use: allowed
    attribution: Hokkaido Government, source link, and modifications required
    restriction: use both point and polygon data; publication held pending visitability and site safety checks
    decision: conditional
    evidence: https://www.harp.lg.jp/opendata/dataset/1245.html
  - name: Japan Search Mie regional cultural assets database
    cost: free API access
    license: Mie Prefecture site policy; reuse permission unconfirmed
    commercial_use: blocked
    attribution: not sufficient to resolve reuse prohibition
    restriction: source site policy prohibits unauthorized reproduction; exclude until explicit permission
    decision: blocked
    evidence: https://www.bunka.pref.mie.lg.jp/42550034923.htm
  - name: National Land Numerical Information prefectural cultural properties P32
    cost: free
    license: non-commercial
    commercial_use: not allowed for the intended affiliate-supported site
    attribution: required if used in an eligible non-commercial context
    restriction: declined; 2014 snapshot also omits all records for Tokyo, Nara, and Oita
    evidence: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-P32.html
