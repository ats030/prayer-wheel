[project]
name = "app-hub"
version = "0.1.0"
description = "Local metadata index for ats030 desktop apps"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
app-hub = "app_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
