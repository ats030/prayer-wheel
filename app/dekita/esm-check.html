<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ESM Syntax Check</title>
</head>
<body>
  <h1>ESM Syntax Check</h1>
  <div id="output"></div>
  <script type="module">
    const modules = [
      './src/modules/index.js',
      './src/modules/core/GameState.js',
      './src/modules/core/AudioManager.js',
      './src/modules/core/ScreenManager.js',
      './src/modules/core/GameBase.js',
      './src/modules/games/CountGame.js',
      './src/modules/games/ColorGame.js',
      './src/modules/games/AnimalGame.js',
      './src/modules/games/MazeGame.js'
    ];
    const output = document.getElementById('output');
    
    let count = 0;
    modules.forEach(async (url) => {
      try {
        await import(url);
        count++;
        output.innerHTML += `<p style="color:green">✓ ${url} loaded</p>`;
      } catch (e) {
        output.innerHTML += `<p style="color:red">✗ ${url}: ${e.message}</p>`;
      }
      if (count === modules.length) {
        output.innerHTML += '<p>Check completed</p>';
      }
    });
  </script>
</body>
</html>
