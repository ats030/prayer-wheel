<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>できた！</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>できた！</h1>
    </header>
    
    <div id="title-screen" class="screen">
      <button id="start-btn" class="game-btn">スタート</button>
    </div>
    
    <div id="number-select-screen" class="screen hidden">
      <h2>どの数字?</h2>
      <div id="number-grid" class="number-grid"></div>
    </div>
    
    <div id="game-screen" class="screen hidden">
      <div class="score-board">
        <span>スコア: <span id="score">0</span></span>
        <button id="reset-btn" class="reset-btn">リセット</button>
      </div>
      
      <div id="question-area" class="question-area">
        <div id="picture-area" class="picture-area"></div>
        <p id="question-text" class="question-text">なにが いくつ?</p>
        <div id="answer-buttons" class="answer-buttons"></div>
      </div>
      
      <div id="feedback-area" class="feedback-area hidden">
        <p id="feedback-text" class="feedback-text">せいかい!</p>
        <button id="next-btn" class="next-btn">つぎへ</button>
      </div>
    </div>
    
    <div id="result-screen" class="screen hidden">
      <h2>おわった!</h2>
      <p class="final-score">スコア: <span id="final-score">0</span></p>
      <button id="replay-btn" class="game-btn">もういっかい!</button>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
