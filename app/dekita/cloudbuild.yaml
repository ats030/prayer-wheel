# Cloud Build configuration for dekita
# Deploys to Cloud Run in Asia Northeast1 region
# Project: dekita-507214
steps:
  - name: 'ubuntu'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cat > Dockerfile << 'EOF'
        FROM nginx:alpine
        RUN mkdir -p /usr/share/nginx/html/src
        RUN rm /etc/nginx/conf.d/default.conf
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        COPY index.html /usr/share/nginx/html/
        COPY style.css /usr/share/nginx/html/
        COPY favicon.svg /usr/share/nginx/html/
        COPY src /usr/share/nginx/html/src/
        COPY audio /usr/share/nginx/html/audio/
        EXPOSE 8080
        CMD ["nginx", "-g", "daemon off;"]
        EOF

        cat > nginx.conf << 'NGINXEOF'
        server {
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            location / {
                try_files $uri $uri/ /index.html =404;
            }
            location /src/ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }
            location = /style.css {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }
            location = /favicon.svg {
                add_header Cache-Control "max-age=31536000, immutable";
                add_header X-Content-Type-Options "nosniff";
                add_header X-Frame-Options "DENY";
            }
        }
        NGINXEOF

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '--rm'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'
      - 'ls'
      - '-la'
      - '/usr/share/nginx/html/src'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '--rm'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'
      - 'ls'
      - '-la'
      - '/usr/share/nginx/html/src/modules'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dekita-app'
      - '--image'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'
      - '--region'
      - 'asia-northeast1'
      - '--allow-unauthenticated'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
