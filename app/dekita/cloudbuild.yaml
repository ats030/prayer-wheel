# Cloud Build configuration for dekita
# Deploys to Cloud Run in Asia Northeast1 region
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dekita-app'
      - '--image'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'
      - '--region'
      - 'asia-northeast1'
      - '--allow-unauthenticated'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/dekita/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  # Disable .gcloudignore to include Dockerfile
  ignoreFile: ''
