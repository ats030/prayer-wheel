# Cloud Build configuration for dekita
# Deploys to Cloud Run in Asia Northeast1 region
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/dekita/app:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/dekita/app:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dekita-app'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/dekita/app:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--allow-unauthenticated'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/dekita/app:$COMMIT_SHA'

substitutions:
  _REGION: 'asia-northeast1'

options:
  logging: CLOUD_LOGGING_ONLY
