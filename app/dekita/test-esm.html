<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test ESM Load</title>
</head>
<body>
  <h1>Test ESM Load</h1>
  <div id="output"></div>
  
  <script type="module">
    try {
      import { GameState } from './src/modules/core/GameState.js';
      const state = new GameState();
      document.getElementById('output').innerHTML = '<p>GameState loaded successfully!</p><p>testMode: ' + state._testMode + '</p>';
    } catch (e) {
      document.getElementById('output').innerHTML = '<p style="color: red;">Error: ' + e.message + '</p><pre>' + e.stack + '</pre>';
    }
  </script>
</body>
</html>
