<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rss-reader</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}?v={{ static_version }}">
  <link rel="stylesheet" href="/static/linear.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">rss-reader</a>
    <div class="nav-links" aria-label="メインナビゲーション">
      <a href="/" {% if page == 'new' %}class="active" aria-current="page"{% endif %}>新着</a>
      <a href="/feed" {% if page == 'feed' %}class="active" aria-current="page"{% endif %}>フィード</a>
      <a href="/bookmarks" {% if page == 'bookmarks' %}class="active" aria-current="page"{% endif %}>ブックマーク</a>
      <a href="/settings" {% if page == 'settings' %}class="active" aria-current="page"{% endif %}>スコア設定</a>
    </div>
    <span class="spacer"></span>
    <button type="button" class="btn btn-secondary btn-xs" id="refreshAll">↻ 全更新</button>
  </nav>

  <div class="job-bar" id="jobBar" hidden>
    <span class="job-label"></span>
    <span class="job-track"><span class="job-fill"></span></span>
    <span class="job-count muted"></span>
  </div>

  <!-- 自動反映を見送った回の受け皿。読んでいる最中に足元を差し替えないので、
       条件を満たさないときはここに溜めてクリックで反映する。 -->
  <button type="button" class="update-bar" id="updateBar" hidden></button>

  {% block body %}{% endblock %}

  <div class="toast" id="toast"></div>
  <script src="/static/app.js?v={{ static_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
