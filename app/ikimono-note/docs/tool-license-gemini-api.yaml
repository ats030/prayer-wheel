tool: Google Gemini API
plan_or_version: Gemini Developer API / stable Gemini 3.6 Flash, 3.5 Flash, 3.5 Flash-Lite
reviewed_at: 2026-08-09
decision: conditional
price:
  condition: Free and paid usage tiers exist; usage and rate limits vary by model and billing status.
  source: https://ai.google.dev/gemini-api/docs/pricing
commercial_use:
  allowed: true
  source: https://ai.google.dev/gemini-api/terms
restrictions:
  - The API-key owner must accept the Google APIs Terms and Gemini API Additional Terms.
  - Only users aged 18 or older may use it, and the API client must not target or be likely to be accessed by under-18s.
  - Unpaid Services may use submitted photos, prompts, and responses for product improvement and human review; do not submit sensitive, confidential, or personal information.
  - Paid Services require an active Cloud Billing account and do not use prompts, images, or responses to improve Google products.
  - Use is limited to available regions; EEA, Switzerland, and UK public API clients require Paid Services.
  - Google and Gemini names are used only to identify the selected provider and model.
adoption:
  rationale: Optional BYOK provider; no credential is bundled, data-handling differences are shown in the UI, and local processing remains available.
  release_condition: Recheck hosted pricing, stable-model availability, regions, age restrictions, and terms before public release.
