tool: 環境省 国内希少野生動植物種一覧 (種の保存法)
plan_or_version: 令和7年2月更新版 — 別表第一 458種 + 緊急指定種 3種 = 同梱 461件
reviewed_at: 2026-08-12
decision: approved
implemented: 2026-08-12 (ats030-slxf) — data/protected_species.json, protected_species.py
price:
  condition: Free. Static Excel and HTML on env.go.jp; no API, no key, no rate limit.
  source: https://www.env.go.jp/nature/kisho/domestic/list.html
license:
  terms: 環境省ホームページ利用ルール (公共データ利用規約 第1.0版 / PDL1.0 準拠)
  source: https://www.env.go.jp/mail.html
commercial_use:
  allowed: true
  evidence: >
    「どなたでも(略)複製、公衆送信、翻訳・変形等の翻案等、自由に利用できます。商用利用も可能です」
    (環境省の同一利用ルールを掲げる https://kanto.env.go.jp/help.html より)
attribution: >
  「出典：環境省ホームページ（当該ページのURL）」。加工した場合は編集・加工を行ったこと
  およびその主体を併記する。
restrictions:
  - 環境省ロゴマークは対象外。
  - 国土地理院の地図を含むコンテンツは測量法により別扱い (この一覧には地図を含まない)。
update_frequency: >
  不定期。直近は令和7年2月 (458種)。指定の追加は年単位で告示される。同じ xlsx の別表第二
  (国際希少野生動植物種) は令和8年3月版まで進んでいるので、ファイル自体はもっと頻繁に差し替わる。
  同梱しているのは別表第一と緊急指定種の2枚だけ。
national_coverage: 全国。地理データではなく種のリストなので、位置の網羅性という概念がない。
boundary_error: 該当なし。座標を使わない。
data_shape: 和名 + 学名。アプリが既に持ち、iNaturalist で実在確認済みの学名で突き合わせられる。
adoption:
  rationale: >
    座標から採取規制を判定する試み (tool-license-collection-regulation-data.yaml) は所有者と条例が
    埋まらず断念した。一方、規制の4点のうち「保護されている種かどうか」だけは、座標を使わずに
    答えられる。アプリは候補の学名を出し、その学名を図鑑データで実在確認までしている。458件の
    リストと突き合わせるだけで、位置情報を一切増やさずに1点を未確認から確認済みへ動かせる。
  release_condition: >
    リストは同梱し、実行時に env.go.jp を叩かない (種名を外部へ送らないため、また告示は年単位で
    しか変わらないため)。同梱した版の更新日を画面に出す。一致は学名の完全一致に限る。
    一致しなかったことを「規制対象ではない」とは表示しない — 一致しない理由には、候補自体が
    外れている場合と、都道府県の条例で別に指定されている場合がある。
known_gap: >
  完全一致なので、亜種で指定されている分類群 (例 Acheilognathus tabira nakamurae) は、候補が種名
  (Acheilognathus tabira) で返ったときに当たらない。取りこぼす向きに倒してある。前方一致を許すと、
  亜種1つが指定されているだけの種を丸ごと「指定されています」と出すことになり、法律の話で嘘をつく。
  取りこぼしても利用者が置かれる位置は今までと同じ (安全カードが「確認が必要」と述べている)。
  never_display: >
    一致したときも採取の可否は述べない。「種の保存法の国内希少野生動植物種です」と事実を示し、
    環境省の該当ページへ送る。安全カードの「持ち帰ってよいか：確認が必要」は変えない。
sources:
  - https://www.env.go.jp/nature/kisho/domestic/list.html
  - https://www.env.go.jp/nature/kisho/hozen/hozonho.html
  - https://www.env.go.jp/mail.html
  - https://kanto.env.go.jp/help.html
