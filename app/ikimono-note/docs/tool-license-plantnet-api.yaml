tool: Pl@ntNet API
plan_or_version: identification API v2, free or commercial plan
reviewed_at: 2026-08-09
decision: conditional
price:
  condition: Free up to 500 identification requests per day; commercial use beyond that requires a paid agreement.
  source: https://my.plantnet.org/terms_of_use
commercial_use:
  # 公開版は BYOK なので、どの枠を使うかは鍵の持ち主しだい。ここが両プランを
  # 見た conditional なのはそのため。ai-workflow/tool-license-registry.yaml の
  # 「Pl@ntNet API (植物識別)」は運営者が無料枠を使う場合に絞って書いてある。
  allowed: conditional
  note: 無料プラン (500件/日) は非営利・教育・科学目的に限られる。商用にするなら有料プラン €1,000/年〜へ移る。
  source: https://my.plantnet.org/terms_of_use
restrictions:
  - Requires a user-owned API key and account.
  - Free use is limited to 500 identification requests per day; commercial use beyond that is paid.
  - Free use may require Pl@ntNet acknowledgement and logo under its terms.
  - Submit only photos the user explicitly agrees to send; images are processed in volatile memory according to the terms.
  - Do not expose or return the API key.
adoption:
  rationale: Optional plant-only comparison experiment; existing VLM remains the fallback.
  release_condition: Keep explicit opt-in off by default, write-only BYOK storage, attribution, quota handling, and fallback.
# 2026-08-17 追記 (ats030-mi13.6): 同じ対象の記録が ai-workflow/tool-license-registry.yaml にも
# あり (名前は「Pl@ntNet API (植物識別)」)、そちらは commercial_use を
# 「no (無料プランは非営利・教育・科学目的)」と書いている。判断 (conditional) は一致しており
# 意味も同じだが、名前が違うためライセンスタブの食い違い検出をすり抜けていた。
cross_references:
  - record: ai-workflow/tool-license-registry.yaml
    name_there: Pl@ntNet API (植物識別)
    note: 帰属表示の実装 (plantnetCreditHtml) と自前計測の数値はそちらに詳しい。
  - record: docs/tool-license-affiliate.yaml
    note: >-
      「商用化」の引き金は広告フラグ。そこの commercial_switch_dependencies と対で判断する。
      同じ引き金で Tailscale Personal (非商用限定) も同時に効く。
