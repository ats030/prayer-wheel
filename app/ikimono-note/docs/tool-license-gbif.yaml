operation:
  privacy: scientific name only; no photos, location, keys, cookies or user identity
  bounds: one fallback request per candidate; fixed host/path/checklist; 5s timeout; 256KiB response; bounded isolate cache
  rate: at most one lookup per second per isolate; honor Retry-After; no automatic retry on 429
  rollback: disable IKIMONO_GBIF_FALLBACK in both protected-preview Workers
  persistence: no new database, table, scheduler or data migration
notes:
  - Attribution/source/license conditions are implemented in capture and history; regression checks cover both views.
  - Official current taxonomy migration recommends v2 with this COL XR checklist; legacy 2023 GBIF backbone is not used.
  - Skill references templates/tool-license.yaml, but that template is absent from the installed package; this is the equivalent review record.
sources:
