tool: Existing Workers and HTTP Service Binding, isolated protected production candidate
plan_or_version: Workers Free; D1 Free; Wrangler 4.149.0; unchanged pinned Python and browser dependencies
reviewed_at: 2026-10-10
status: conditional
cost:
  condition: Keep existing Free account; no paid upgrade, build integration or add-on.
  limits: 100k Worker requests/day; 10ms CPU/invocation; existing D1 Free limits.
  failure: Stop at Free limits; do not treat HTTP200 or separate Workers as proof of full-path CPU compliance.
license:
  commercial_use: Existing Cloudflare agreement permits entity service use subject to its terms and service-specific terms.
  attribution: Existing fixed dependencies and notices retained, including browser decoder corresponding sources.
conditions:
  - Distinct candidate Basic password and session key; Google client retained.
  - Candidate D1 is separate from preview, source Firestore remains unchanged.
  - Private backend has no external URL or routes; fixed gateway binding only.
  - Basic authentication and noindex remain at both entrypoints; no general public release.
  - Explicitly disabled automatic request-log storage avoids retaining share-token URLs.
  - General release requires Free resource, OAuth, Drive, data-delta and old-share continuity validation.
adoption: protected_production_connection_experiment_only
