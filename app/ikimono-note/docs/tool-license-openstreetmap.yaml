tool: OpenStreetMap embedded map
reviewed_at: 2026-08-09
status: conditional
cost:
  condition: Free, best-effort OSMF-hosted service with no SLA.
license:
  data: ODbL-1.0
  commercial_use: allowed_with_attribution
conditions:
  - Show visible "© OpenStreetMap contributors" attribution linked to the copyright page.
  - Load a map only after a user action; do not prefetch, bulk download, or offer offline tiles.
  - Preserve normal browser Referer and caching behavior.
  - Warn that the rounded coordinate is sent to OpenStreetMap before loading.
privacy:
  decision: Opt-in per location; history remains in IndexedDB and is not sent.
sources:
  - https://operations.osmfoundation.org/policies/tiles/
  - https://osmfoundation.org/wiki/Terms_of_Use
  - https://www.openstreetmap.org/copyright
adoption: approved_only_with_the_conditions_above
