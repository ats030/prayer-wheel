tool: Existing Cloudflare D1, isolated production candidate and migration probe
plan_or_version: D1 Free; existing Cloudflare account and httpx dependency
reviewed_at: 2026-10-10
status: conditional
cost:
  condition: Keep Workers Free, no paid upgrade or other storage services.
  limits: 10 databases; 500 MB per database; 5 GB total; 5M reads/day; 100k writes/day.
  failure: D1 operations stop at Free limits; this work does not change billing plans.
license:
  commercial_use: Cloudflare Self-Serve Agreement grants service use to individuals and entities subject to its restrictions and service terms.
conditions:
  - Candidate and synthetic probe stay separate from the preview database.
  - Neither new database is attached to a public Worker during this experiment.
  - Real-data source is the existing owner's Firestore; retain source without writes or deletion.
  - Preserve exact values, with private local artifacts and aggregate-only operator output.
  - Public release remains conditional on functionality, data continuity and resource validation.
adoption: isolated_migration_experiment_only
sources:
  - https://developers.cloudflare.com/d1/platform/pricing/
  - https://developers.cloudflare.com/d1/platform/limits/
  - https://www.cloudflare.com/terms/
