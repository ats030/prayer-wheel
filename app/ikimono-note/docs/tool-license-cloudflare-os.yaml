tool: Cloudflare OS (自分の Cloudflare アカウントへ入れる自己ホスト)
plan_or_version: 2026-08-05 公開版 (github.com/cloudflare/cloudflare-os, main)
reviewed_at: 2026-08-13
question: 生きものノートの運営作業を載せる置き場として、課金なしで自己ホストできるか
decision: blocked
summary: >
  お金の壁より先にアクセスの壁がある。中核の Worker Loader (Dynamic Workers) は、本番の
  Cloudflare で動かすのにクローズドβへの申し込みが要る。申し込みが通るまで、無料で入れられる
  かどうか以前にデプロイできない。他のバインディングは無料枠に収まる。

license:
  code: Apache-2.0
  source: https://github.com/cloudflare/cloudflare-os
  commercial_use: allowed

# packages/workshop-backend/wrangler.jsonc に宣言されているもの
bindings:
  - name: Durable Objects (SQLite backend)
    detail: migrations の new_sqlite_classes に UserDurableObject / OverseerDurableObject / AdminSettings
    free_plan: available
    quote: "Workers Free plan: Only Durable Objects with SQLite storage backend are available."
    free_limits: リクエスト 10万/日、実行 13,000 GB-s/日、SQLite 5GB
    source: https://developers.cloudflare.com/durable-objects/platform/pricing/
  - name: Browser Rendering
    free_plan: available
    quote: "Available on Free and Paid plans"
    free_limits: ブラウザ時間 10分/日、同時3ブラウザ
    source: https://developers.cloudflare.com/browser-rendering/platform/pricing/
  - name: KV / R2
    free_plan: available
    detail: BLUEPRINTS / AVATARS (KV)、gadgets-blueprint-content (R2)。一人運用の量なら無料枠内
  - name: Worker Loader (Dynamic Workers)
    free_plan: blocked
    quote: "to run dynamic Workers on Cloudflare, you must sign up for the closed beta"
    detail: >
      エージェントがコードを書いて実行する隔離環境。Cloudflare OS の中核で、外せない。
      料金の記載は公式ドキュメントにない。βのあいだ1日1ワーカーあたり $0.002 が免除、という
      記述を第三者の記事で見たが、Cloudflare の一次情報では確認できていない。
      公式ドキュメントには「They may also be priced differently, when Worker Loaders become
      generally available」とあり、GA 時に変わりうる。
    source: https://developers.cloudflare.com/workers/runtime-apis/bindings/worker-loader/

separate_costs:
  - 推論そのものの費用。AI Gateway を通す先のモデルに対して発生し、Cloudflare OS の料金とは別。

adoption:
  verdict: いまは入れない。
  rationale: >
    (1) Worker Loader がクローズドβで、通るかどうかも時期も読めない。
    (2) 通ったとしても GA 時の価格が未定で、載せたあとに費用が決まる形になる。
    (3) 公開から8日の企業向けツールで、想定利用者は社内従業員。一人運用のプロジェクトでは
        足場のほうが載せる荷物より重い。
    (4) 配布の詰まり (ats030-rx76: Tailscale Personal が非商用) はこれでは解けない。
        そちらは Cloudflare Tunnel か別基盤の話。
  revisit_if: >
    Worker Loader が GA になり価格が公表されたとき。そのとき載せる候補は、利用者向けの画面では
    なく運営の周辺 (Amazon の適格性の見張り、種の保存法リストの年次更新、tool-license の調査)。
    アプリ本体は FastAPI + Pillow + Ollama で Workers 上では動かないため、対象外。

sources:
  - https://github.com/cloudflare/cloudflare-os
  - https://blog.cloudflare.com/cloudflare-os/
  - https://raw.githubusercontent.com/cloudflare/cloudflare-os/main/packages/workshop-backend/wrangler.jsonc
  - https://developers.cloudflare.com/durable-objects/platform/pricing/
  - https://developers.cloudflare.com/browser-rendering/platform/pricing/
  - https://developers.cloudflare.com/workers/runtime-apis/bindings/worker-loader/
