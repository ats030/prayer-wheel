tool: 環境省生物多様性センター 現存植生図2024
plan_or_version: vg2024 MapServer; reviewed 2026-08-15
decision: approved
implemented: 2026-08-15
price:
  condition: 無料の公開データ・公開MapServer。APIキーや有料プランは不要。
license:
  name: 公共データ利用規約 第1.0版（PDL1.0）
  commercial_use: true
  modification_and_redistribution: 出典と加工主体を明記すれば可能。本実装は保存・再配布しない。
attribution: 環境省生物多様性センター（現存植生図2024）
restrictions:
  - 公式MapServerを植生レイヤ選択時だけ参照する。
  - タイルや属性を保存、一括取得、再配布しない。
  - 地点照会は群落名、植生自然度、植生自然度区分、作成年度だけを一時表示する。
  - 作成年度は地域ごとに異なり、現在の現地状況と一致しない場合がある。
  - レート上限は明記されていないため、画面操作に伴う通常の単発参照に限る。
privacy:
  decision: opt-in
  detail: 地図表示後、中央地点を自サービス経由で公式MapServerへ送り、植生レイヤ選択時は表示範囲を公式MapServerへ送る。写真、候補名、観察記録は送らない。
adoption:
  rationale: 全国を覆う公式植生図から、観察地点の群落名と植生自然度を確認できる。
  rollback: 植生レイヤ、地点照会API、CSP許可先を削除すればデータ移行なしで復旧できる。
sources:
  - https://www.biodic.go.jp/copyright/terms_of_service.html
  - https://www.biodic.go.jp/ikimonomap.html
  - https://www.biodic.go.jp/kiso/vg/vg_kiso.html
  - https://arc-gis.biodic.go.jp/arcgis/rest/services/webgis/vg2024/MapServer
