tool: J-SHIS 250m微地形区分・国土数値情報100m土地利用メッシュ
plan_or_version: J-SHIS V4 JCODE WMS; L03-b-2016 XYZ; reviewed 2026-08-15
decision: conditional
implemented: 2026-08-15 (ats030-928v)
price:
  condition: Both are free public map services; no API key, account, or paid plan.
  sources:
    - https://www.j-shis.bosai.go.jp/wms-sstrct
    - https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-L03-b-v3_1.html
license:
  j_shis: J-SHIS利用規約。閲覧利用とデータ利用は無償。出典明示が必要。
  mlit: 国土数値情報利用約款（政府標準利用規約 / PDL1.0互換）。出典明示により商用利用可。
commercial_use:
  j_shis: 画面上の参照表示は採用。データを加工した商品の販売は事前に防災科研へ問い合わせるまで行わない。
  mlit: true
attribution:
  j_shis: 防災科学技術研究所 J-SHIS（250m微地形区分）
  mlit: 国土交通省 国土数値情報（2016年土地利用100mメッシュ）
restrictions:
  - 利用者が地図を開いた後、中央地点のJ-SHIS微地形と国土数値情報土地利用を取得する。レイヤ画像は対象レイヤを選択した時だけ取得する。
  - 土地利用の地点分類は公式Z16タイルの該当1画素をサーバー側で読み、公式凡例の12色への完全一致だけを分類名にする。近似色は推測せずデータなしとする。
  - タイルやWMS画像を保存、一括取得、再配布しない。
  - J-SHISの微地形は250m区画の分類であり、個々の地点の地質調査結果として扱わない。
  - 土地利用は2016年データであり、現在の土地利用と一致しない場合がある。
  - 外部配信停止時は該当レイヤだけ表示できなくなり、観察記録には影響しない。
privacy:
  decision: opt-in
  detail: 地図表示後に利用者が各レイヤを選んだ場合だけ表示範囲がJ-SHISまたは国土交通省へ送られる。写真、候補名、観察記録は送らない。
adoption:
  rationale: 詳細土地条件図の未整備地域でも、全国を覆う地形・地盤と土地利用の文脈を別々のレイヤで確認できる。
  rollback: MAP_LAYERSの全国微地形と土地利用を削除しCSP許可先を戻せば、データ移行なしで復旧できる。
sources:
  - https://www.j-shis.bosai.go.jp/wms-sstrct
  - https://www.j-shis.bosai.go.jp/labs/wm2020/
  - https://www.j-shis.bosai.go.jp/agreement
  - https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-L03-b-v3_1.html
  - https://nlftp.mlit.go.jp/ksj/other/agreement_01.html
  - https://nlftp.mlit.go.jp/webmapc/layers_txt/layer_kokjyo.txt
