tool: お試し枠 (運営者の鍵を見知らぬ利用者に貸す用途) の提供元候補
plan_or_version: Gemini / OpenAI / Anthropic / Pl@ntNet の 2026-08-16 時点の規約
reviewed_at: 2026-08-16
decision: declined
price:
  condition: いずれも運営者の鍵で走るため、費用は利用者ではなく運営者に来る。維持費ゼロの方針 (ats030-y9fb) と衝突する。
  source: https://ai.google.dev/gemini-api/terms
commercial_use:
  allowed: conditional
  source: https://my.plantnet.org/terms_of_use
restrictions:
  # 全年齢を明言したアプリ (利用規約「年齢制限はなく、どなたでもご利用いただけます」) で、
  # 運営者の鍵を貸せるかだけを見た。BYOK は規約上の You が鍵の持ち主なので、この評価とは別。
  - "Gemini: 'You must be 18 years of age or older to use the APIs' および 18歳未満がアクセスしそうなサービスでの利用禁止。全年齢アプリでは運営者の鍵を使えない。無料枠は人手レビューも入る。"
  - "OpenAI: 13歳以上 (18歳未満は保護者の許可)。未成年へ提供する場合は年齢確認・コンテンツモデレーション・COPPA等の遵守が要り、13歳未満の個人データは zero data retention を先に入れること。禁止ではないが条件が重い。"
  - "Anthropic: Commercial Terms に年齢条項なし。Usage Policy は未成年向け製品を禁じず、Guidelines for Organizations Serving Minors (年齢確認・モデレーション・監視・COPPA・AI利用の開示) の遵守を求める。禁止ではないが条件が重い。"
  - "Pl@ntNet: 年齢条項が一切ない。ただし無料枠は1日500件までで、それを超える商用利用は有料。このアプリは広告を出しており商用にあたる。加えて一人一法人につき無料アカウント1つの制限がある。"
adoption:
  rationale: >
    年齢条項だけを見れば Pl@ntNet と Anthropic/OpenAI には道がある。採らないのは規約ではなく費用と実装の問題。
    お試し枠は運営者の鍵で走るので、利用が伸びるほど運営者の請求が増える。維持費ゼロを前提にした運用と両立しない。
    OpenAI と Anthropic は年齢確認とモデレーションを自前で用意する必要があり、写真1枚を試させるための仕掛けとしては重い。
    Pl@ntNet は植物しか答えられず、動物・菌類を撮った人はどのみち鍵を求められる。
    したがって BYOK に徹する。新規の人が試せない不便は残るが、それは既知の制約として受け入れる。
  release_condition: >
    お試し枠を再開する場合は、選んだ提供元の年齢条項と費用をこの表で採り直すこと。
    Gemini だけは条件を満たしようがないので、再開するなら別の提供元になる。
