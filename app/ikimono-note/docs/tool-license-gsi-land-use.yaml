tool: 国土地理院 20万分1土地利用図（1982〜1983年）地理院タイル
plan_or_version: lum200k raster tiles, reviewed 2026-08-15
decision: declined
implemented: 2026-08-15 (ats030-zk4l)
removed: 2026-08-15 (ats030-i079)
price:
  condition: Free public XYZ tile service; no API key or paid plan.
  source: https://maps.gsi.go.jp/development/ichiran.html
license:
  terms: 国土地理院コンテンツ利用規約（公共データ利用規約 第1.0版 / PDL1.0）
  source: https://web1.gsi.go.jp/kikakuchousei/kikakuchousei40182.html
commercial_use:
  allowed: true
  evidence: 公共データ利用規約に従い利用可能。ウェブサイトでのリアルタイム読み込みは出典明示により申請不要。
attribution: 表示中は「国土地理院」へのリンクと「20万分1土地利用図・1982〜83年」を常時表示する。
restrictions:
  - 提供ズームは11〜14。アプリは11未満で選択された場合にズーム11へ移動し、14超ではZL14を拡大表示する。
  - 提供範囲は日本全国の一部を除く。範囲外を現在の土地利用が存在しない意味に解釈しない。
  - 1982〜1983年の資料であり、現在の土地利用として表示しない。
  - 地理院タイルは一括取得・再配布せず、利用者が地図を開いて選択したときだけブラウザから取得する。
privacy:
  decision: opt-in
  detail: 地図表示ボタン押下後、利用者がこのレイヤを選んだ場合だけ、表示範囲のタイル座標が国土地理院へ送られる。写真・候補名・観察記録は送らない。
adoption:
  # 下の rationale と release_condition、および restrictions の「アプリは〜する」は、
  # 採用を検討していたときに書いたもの。実装には至っていない (2026-08-17 時点で
  # コードにこのタイルへの参照は無く、README の地図の下敷き4種にも入っていない)。
  # decision: declined はその実態と合っている。
  # 未記入: 採らないと決めた理由と、根拠の取得日 (evidence_retrieved)。どちらも
  # 決めた本人にしか書けないので、ここでは埋めずに残す。
  rationale: 既存Leafletと国土地理院タイル配信元を再利用でき、依存追加なしで観察場所の過去の周辺環境を振り返れる。
  release_condition: 年代、出典、縮尺制限、任意読み込みをUIと実装で維持する。
sources:
  - https://maps.gsi.go.jp/development/ichiran.html
  - https://maps.gsi.go.jp/development/siyou.html
  - https://web1.gsi.go.jp/kikakuchousei/kikakuchousei40182.html
  - https://www.gsi.go.jp/LAW/2930-index.html

removal:
  reason: JAXA 2024 land cover is the adopted successor direction; retaining the 1982–83 layer would crowd the picker and invite comparison as if it described current habitat.
