tool: JAXA 高解像度土地利用土地被覆図 日本域 (HRLULC-Japan)
plan_or_version: v25.04 (2020JPN / 2022JPN / 2024JPN、2025年4月リリース)
reviewed_at: 2026-08-16
decision: blocked
price:
  condition: >
    データそのものの価格は未確認。ただし配布は GeoTIFF (131タイル × 3時期) のみで、
    WMS/WMTS/XYZ のタイル配信サービスが公開されていない。地図へ載せるには自前でタイル化して
    配信することになり、その保管と配信に費用が出る。Cloud Run にディスクは無く、
    Cloud Storage の Always Free は us-east1 / us-west1 / us-central1 のみで東京は課金対象。
  source: https://www.eorc.jaxa.jp/ALOS/jp/dataset/lulc/lulc_v2504_j.htm
commercial_use:
  allowed: unknown
  source: https://www.jaxa.jp/policy_j.html
restrictions:
  # データセット固有の利用条件は、ダウンロードにユーザ登録を求める別ページにあり未確認。
  # 以下は JAXA の一般サイトポリシーから読めるところまで。
  - "配布形式は GeoTIFF のみ。タイル配信サービスは公開されていない (2026-08-16 時点)。"
  - "ダウンロードにユーザ登録が必要。登録して得たデータを第三者へタイルとして再配信できるかは未確認。"
  - "JAXA サイトポリシーでは、報道・学術・教育・科学館・私的利用は承認不要だが、企画番組や書籍、企業の宣伝は承認が要り、映像作品・コマーシャル・製品販売は有償ライセンス。広告を出している本アプリがどれに当たるかは判断が要る。"
  - "出典表示は「提供：宇宙航空研究開発機構（またはJAXA）」または「(c) 宇宙航空研究開発機構」。他機関との共有著作物はそれぞれの出典を表示する。"
adoption:
  rationale: >
    採否を決めるには利用条件の確認が要るが、その手前で採らない理由がある。
    既存の地図レイヤ (国土地理院・J-SHIS・国土交通省 nlftp・環境省 biodic) はすべて配信元の
    タイルを直接参照しており、運営者は1枚も配信していない。だから地図を増やしても維持費が増えない。
    HRLULC だけは GeoTIFF しか無いため、載せるなら自前配信になり、この性質がそこで崩れる。
    土地利用は国土交通省の 2016年 100m メッシュを既に表示しており、観察の文脈を読むには足りている。
    解像度と新しさは上がるが、そのために運営コストの形を変えるほどではない。
  release_condition: >
    JAXA がタイル配信サービスを公開したら、この判断はやり直す価値がある。
    自前配信のまま進める場合は、先にデータセット固有の利用条件 (再配布の可否・商用利用の区分) を
    一次情報で確認し、GCS の保管と配信の費用を見積もること。
