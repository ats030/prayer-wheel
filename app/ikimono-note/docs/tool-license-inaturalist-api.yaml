tool: iNaturalist API
plan_or_version: public read-only API v1
reviewed_at: 2026-08-09
decision: conditional
price:
  condition: Public read-only access has no documented usage fee; rate limits apply.
  source: https://www.inaturalist.org/pages/developers
commercial_use:
  allowed: conditional
  source: https://www.inaturalist.org/pages/terms
restrictions:
  - Keep requests near 1 per second and below about 10000 per day.
  - Send a custom User-Agent and do not scrape or bulk-download through the API.
  - iNaturalist data must not be used to train commercial AI systems.
  - Observation content and media have per-item licenses; do not copy them without checking attribution and commercial-use terms.
  - Sending user-entered location to the hosted API requires explicit disclosure and consent.
adoption:
  rationale: Optional taxonomy-name validation; only model-derived scientific names are sent, never photos or user-entered location.
  release_condition: Keep explicit opt-in, 1 request/second throttling, User-Agent, caching, and graceful fallback.