<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="description" content="地域と泉質から、各地の温泉を検索・地図表示できます。日帰り入浴や効能などの情報もあわせて確認できます。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="温泉マップ">
  <meta property="og:title" content="温泉マップ｜地域と泉質から各地の温泉を探す">
  <meta property="og:description" content="地域と泉質から、各地の温泉を検索・地図表示できます。日帰り入浴や効能などの情報もあわせて確認できます。">
  <meta property="og:url" content="https://onsen-map-736831430371.asia-northeast1.run.app/">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://onsen-map-736831430371.asia-northeast1.run.app/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/app.css?v=20260916">
  <link rel="stylesheet" href="/detail-panel.css?v=20260916">
</head>
<body>
  <main class="app-shell">
    <section class="workbench" aria-label="温泉を探す">
      <header class="masthead"><h1>温泉マップ</h1><p class="lede">地域と泉質から、各地の温泉を探せます。<a href="/changelog.html">更新履歴</a></p></header>
      <div class="filters" role="search">
        <label class="field field-wide">温泉名・地域<input id="keyword" type="search" placeholder="例：由布院、大分" autocomplete="off"></label>
        <label class="field">都道府県<select id="prefecture"><option value="">すべて</option></select></label>
        <label class="field">泉質<select id="spring-type"><option value="">すべて</option></select></label>
      </div>
      <div class="result-bar" aria-live="polite"><span><strong id="result-count">0</strong> 件の温泉</span><button id="clear-filters" type="button">条件をクリア</button></div>
      <div class="onsen-list" id="onsen-list"></div>
    </section>
    <section class="map-region" aria-label="温泉の地図"><div id="map"></div><div class="map-count" id="map-count">読み込み中</div><div class="map-legend" aria-label="マーカーの色分け凡例"><span><span class="legend-dot legend-dot--open"></span>営業中</span><span><span class="legend-dot legend-dot--closed"></span>閉鎖・休止</span><span><span class="legend-dot"></span>不明</span></div></section>
    <aside class="detail-panel" id="detail-panel" aria-labelledby="detail-panel-label" tabindex="-1" hidden>
      <header class="detail-header"><div><p class="eyebrow" id="detail-panel-label">温泉の詳細</p><p class="detail-origin" id="detail-origin">選択中の温泉</p></div><button class="detail-close" type="button" aria-label="詳細を閉じる">×</button></header>
      <div class="detail-content" id="detail-content" aria-live="polite"></div>
    </aside>
  </main>
  <dialog id="lightbox" aria-label="温泉の画像"><button class="lightbox-close" type="button" aria-label="画像を閉じる">×</button><img id="lightbox-image" alt=""></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="http://ubuntu-server-app:8526/v.js" data-site="onsen-map" defer></script>
  <script src="/app.js?v=20260916"></script>
</body>
</html>
