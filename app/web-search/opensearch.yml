services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    container_name: web-search-opensearch
    restart: unless-stopped
    env_file:
      - /home/ats030/.config/web-search-opensearch/server.env
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      plugins.security.ssl.http.pemcert_filepath: tls/server.pem
      plugins.security.ssl.http.pemkey_filepath: tls/server-key.pem
      plugins.security.ssl.http.pemtrustedcas_filepath: ${OPENSEARCH_BOOTSTRAP_CA:-tls/server.pem}
      # Enable the bundled bootstrap admin certificate only for initial hardening.
      plugins.security.authcz.admin_dn: '["${OPENSEARCH_BOOTSTRAP_ADMIN_DN:-CN=web-search-disabled}"]'
    ports:
      - "127.0.0.1:9200:9200"
      # Dashboards shares this network namespace (see below), so its port is published here.
      - "127.0.0.1:5601:5601"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - /home/ats030/.config/web-search-opensearch/tls:/usr/share/opensearch/config/tls:ro
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      options:
        max-size: "20m"
        max-file: "2"
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0@sha256:4bdb8ded547ce7f4c379a10261f1b4aad58726900c215be570a7d1fe86f2a7d8
    container_name: web-search-opensearch-dashboards
    restart: unless-stopped
    # Reach OpenSearch as https://localhost:9200 so the localhost-only certificate
    # verifies in full; no container DNS name or SAN change is needed.
    network_mode: "service:opensearch"
    depends_on:
      - opensearch
    env_file:
      - /home/ats030/.config/web-search-opensearch/dashboards.env
    environment:
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - ./opensearch-dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - /home/ats030/.config/web-search-opensearch/tls/server.pem:/usr/share/opensearch-dashboards/config/opensearch-ca.pem:ro
    mem_limit: 1536m
    cpus: 1
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "20m"
        max-file: "2"
volumes:
  opensearch-data:
