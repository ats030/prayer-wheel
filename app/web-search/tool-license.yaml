reviewed_at: 2026-09-30
intended_use: Internal source research for commercial IT articles and teaching materials
decisions:
  - tool: OpenSearch indexing product
    version: 3.9.0, official Docker image listed on the downloads page
    artifact: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    decision: conditional
    spdx: Apache-2.0
    cost: Self-hosted open source; no software licence fee, infrastructure costs remain
    commercial_use: Commercial software use permitted under Apache-2.0; indexed content retains its own terms
    conditions:
      - Retain licences, copyright and NOTICE when redistributing; mark modified files
      - Bundled dependencies and plugins retain their respective notices
      - No trademark rights or endorsement; hosted paid services are outside scope
      - Loopback-only authenticated internal deployment; unique HTTP TLS and disabled demo admin DN
      - Transport demo TLS stays within the single container; replace before multi-node/public exposure
    sources:
      - https://opensearch.org/downloads/
      - https://github.com/opensearch-project/OpenSearch/blob/3.9.0/LICENSE.txt
      - https://docs.opensearch.org/latest/install-and-configure/install-opensearch/docker/
  - tool: YaCy search server
    version: 1.942, official Docker image
    artifact: yacy/yacy_search_server@sha256:55c5e5dd928f312cf47a57afa8d645df37366f15678e0983c8b7fdbe3b5f6475
    decision: conditional
    spdx: GPL-2.0-or-later
    cost: Self-hosted open source; no software licence fee, operator bears infrastructure costs
    commercial_use: Software allows commercial use under GPL; does not grant rights to indexed content
    conditions:
      - Retain copyright and licence notices; distributing modified binaries requires corresponding source under GPL
      - Individual bundled files have other licences, including LGPL; retain their notices
      - Internal HTTP integration does not copy YaCy code into the API
      - No trademark endorsement; optional paid maintainer services are outside scope
      - Public-network membership requires the operator's explicit mode choice
    sources:
      - https://github.com/yacy/yacy_search_server#license
      - https://github.com/yacy/yacy_search_server/blob/master/docker/Dockerfile
  - tool: Python documentation indexed seed pages
    version: Public Python 3 documentation; explicit seed list refreshed manually
    decision: conditional
    spdx: PSF-2.0
    cost: Public documentation, no paid API
    commercial_use: Royalty-free reuse subject to PSF notices and third-party exceptions
    conditions:
      - Retain applicable licence and copyright notices on reused documentation
      - Documentation code examples from Python 3.8.6 also allow 0BSD
      - Inspect page-specific third-party notices; no trademark endorsement
    sources:
      - https://docs.python.org/3/license.html
  - tool: MediaWiki.org indexed seed pages
    version: Public documentation; explicit seed list refreshed manually
    decision: conditional
    spdx: CC-BY-SA-4.0
    cost: Public documentation; no paid service used
    commercial_use: Licensed text allows commercial reuse subject to attribution and ShareAlike obligations
    conditions:
      - Attribute source authors and pages, link licence and identify changes when reusing text
      - Adapted licensed text may require ShareAlike; Help namespace and individual pages have exceptions
      - Respect User-Agent policy, rate limits and API usage policy
      - Do not infer that every generated publication is automatically cleared
    sources:
      - https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
      - https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_API_Usage_Guidelines
      - https://www.mediawiki.org/wiki/API:Opensearch
  - tool: Existing SearXNG search route
    version: Existing local service; upstream selection varies
    decision: review_required
    cost: No new paid service introduced
    commercial_use: Upstream search and destination-content terms remain unverified
    conditions:
      - Explicit legacy discovery route only; not a cleared commercial source
    sources:
      - https://docs.searxng.org/
