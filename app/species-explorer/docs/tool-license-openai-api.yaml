tool: OpenAI API
plan_or_version: pay-as-you-go / gpt-5.6-luna
reviewed_at: 2026-08-09
decision: conditional
price:
  condition: Usage-based billing is paid by the API-key owner.
  source: https://openai.com/api/pricing/
commercial_use:
  allowed: true
  source: https://openai.com/policies/services-agreement/
restrictions:
  - The API-key owner must accept and comply with the current OpenAI agreement and policies.
  - API keys must not be sold or transferred; this app only forwards a key for its owner's request.
  - Inputs must be supplied with the rights and permissions required by the agreement.
  - OpenAI names and marks are used only to identify the selected provider.
adoption:
  rationale: Optional BYOK provider; no credential is bundled and local processing remains available.
  release_condition: Recheck hosted pricing, model availability, and terms before public release.
