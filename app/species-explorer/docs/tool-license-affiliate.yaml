reviewed_at: 2026-08-09
intended_use: "写真識別Webアプリの判別結果後に、手動登録した検索リンクまたはAmazon Creators APIが返す図鑑の商品ページを広告として表示"
candidates:
  - name: Amazon Associates Japan
    cost: "参加費の記載なし。紹介料率はカテゴリ等により変動。"
    commercial_use: conditional
    decision: conditional
    conditions:
      - "登録・承認されたWebサイトで所定の特別リンクを使用する"
      - "サイト上に規約指定のアソシエイト参加表示を目立つように掲載する"
      - "有料検索広告、自動リダイレクト、未承認アプリなどの禁止事項を守る"
    sources:
      - https://affiliate.amazon.co.jp/help/operating/agreement/
      - https://affiliate.amazon.co.jp/help/operating/policies/
    note: "Amazon書籍検索用の正式な特別リンクだけを使用し、{query}へ検証済み候補名をURLエンコードして挿入。Species Explorerを掲載媒体として承認済みであることを公開前に確認する。"
  - name: Amazon Creators API
    cost: "API単体の料金は公式文書に記載されていないが、Amazonアソシエイトの参加・審査条件を満たす必要がある。"
    commercial_use: conditional
    decision: conditional
    conditions:
      - "Amazonアソシエイトの最終承認を受け、直近30日間に10件の適格販売を満たしてAPIへ登録する"
      - "発行したCredential ID、Secret、Partner Tagを使用し、Secretを利用者へ表示しない"
      - "APIが返す商品タイトルとDetailPageURLを広告として表示し、該当商品がない場合は承認済み検索リンクへ戻す"
      - "アクセストークンの有効期限を守り、API利用条件・表示要件の変更を公開前に再確認する"
    sources:
      - https://affiliate-program.amazon.com/creatorsapi/docs/
      - https://affiliate-program.amazon.com/creatorsapi/docs/en-us/onboarding/register-for-creators-api
      - https://affiliate-program.amazon.com/creatorsapi/docs/en-us/paapiv5-deprecation
    note: "廃止済みのPA-API 5.0ではなくCreators APIを採用。日本向けOAuthエンドポイントとSearchItemsを使い、Booksから候補ごとに1件だけ取得する。"
