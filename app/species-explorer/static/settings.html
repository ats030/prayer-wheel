<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#010102"><title>設定 · Species Explorer</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>:root{color-scheme:dark;--bg:#010102;--panel:#0f1011;--panel2:#18191a;--line:#292b30;--text:#f7f8f8;--muted:#9ca1aa;--accent:#5e6ad2;--accent2:#828fff;--radius:12px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(720px,calc(100% - 28px));margin:auto;padding:24px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:20px;margin:0}.subtitle{color:var(--muted);font-size:13px}.back{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);text-decoration:none;font-weight:600}.back:hover{border-color:#555965;background:var(--panel2)}.back:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}.panel h2{font-size:14px;margin:0 0 12px}.provider{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.provider:first-of-type{border-top:0}.provider input{margin-top:4px;accent-color:var(--accent)}.provider-name{display:block;font-weight:650}.provider-detail{display:block;color:var(--muted);font-size:12px;margin-top:2px}.badge{border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);font-size:11px;white-space:nowrap}.badge.active{border-color:var(--accent);color:#c8ccff}.disabled{opacity:.58}.security{margin:0;padding-left:18px;color:var(--muted)}.security li+li{margin-top:5px}@media(max-width:480px){.provider{grid-template-columns:auto 1fr}.provider .badge{grid-column:2;justify-self:start}.top{align-items:flex-start}}</style></head><body><main class="app"><header class="top"><div><h1>設定</h1><div class="subtitle">識別に使う計算資源とデータの扱い</div></div><a class="back" href="/">撮影へ戻る</a></header><form action="/" method="get"><section class="panel"><h2>計算資源</h2><label class="provider"><input type="radio" name="provider" value="local" checked><span><span class="provider-name">ローカルLLM</span><span class="provider-detail">このサーバーの gemma4:12b を使用。写真は外部サービスへ送信しません。</span></span><span class="badge active">利用可能</span></label><label class="provider"><input type="radio" name="provider" value="openai"><span><span class="provider-name">OpenAI API</span><span class="provider-detail">gpt-5.6-lunaを使用。写真をOpenAIへ送信します。</span></span><span class="badge">利用可能</span></label><label class="provider"><input type="radio" name="provider" value="anthropic"><span><span class="provider-name">Anthropic API</span><span class="provider-detail">claude-sonnet-5を使用。写真をAnthropicへ送信します。</span></span><span class="badge">利用可能</span></label><button class="back" type="submit" style="width:100%;margin-top:12px;background:var(--accent);border-color:var(--accent)">この計算資源を使う</button></section></form><section class="panel"><h2>APIキーと写真</h2><ul class="security"><li>外部APIを選ぶと、撮影画面にAPIキー入力欄が表示されます。</li><li>APIキーは識別リクエストにだけ使い、ブラウザやサーバーへ保存しません。</li><li>写真はメモリ上で処理し、EXIF位置情報を除去して保存しません。</li></ul></section></main><script>const p=new URLSearchParams(location.search).get("provider");if(["local","openai","anthropic"].includes(p)){document.querySelector("[value="+p+"]").checked=true}</script></body></html>
