<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#010102">
  <title>設定 · Species Explorer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#010102;--panel:#0f1011;--panel2:#18191a;--line:#292b30;--text:#f7f8f8;--muted:#9ca1aa;--accent:#5e6ad2;--accent2:#828fff;--danger:#fb7185;--radius:12px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(720px,calc(100% - 28px));margin:auto;padding:24px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:20px;margin:0}.subtitle,.help{color:var(--muted);font-size:12px}.back,.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);text-decoration:none;font:inherit;font-weight:600;cursor:pointer}.button.primary{background:var(--accent);border-color:var(--accent)}.back:focus-visible,.button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}.panel h2{font-size:14px;margin:0 0 12px}.provider{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.provider:first-of-type{border-top:0}.provider>input{margin-top:5px;accent-color:var(--accent)}.provider-name{font-weight:650}.fields{display:grid;gap:10px;margin-top:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:0 11px;font:inherit}.key-row{display:grid;grid-template-columns:1fr auto;gap:8px}.configured{color:#c8ccff;font-size:12px;margin-top:4px}.actions{display:flex;gap:8px}.actions .button{flex:1}.message{min-height:22px;margin:10px 0 0;color:var(--muted)}.message.error{color:var(--danger)}.security{margin:0;padding-left:18px;color:var(--muted)}@media(max-width:480px){.top{align-items:flex-start}.key-row{grid-template-columns:1fr}.actions{flex-direction:column}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div><h1>設定</h1><div class="subtitle">APIキーと使用モデル</div></div><a class="back" href="/">撮影へ戻る</a></header>
  <form id="settingsForm">
    <section class="panel"><h2>計算資源</h2>
      <label class="provider"><input type="radio" name="provider" value="local"><span><span class="provider-name">ローカルLLM</span><span class="help">写真を外部サービスへ送信しません。</span><span class="fields"><span class="field"><label for="model-local">モデル</label><select id="model-local"></select><span class="configured" id="local-model-note"></span></span></span></span></label>
      <label class="provider"><input type="radio" name="provider" value="openai"><span><span class="provider-name">OpenAI API</span><span class="help">写真をOpenAIへ送信します。</span><span class="fields"><span class="field"><label for="model-openai">モデル</label><select id="model-openai"></select></span><span class="field"><label for="key-openai">APIキー</label><span class="key-row"><input id="key-openai" type="password" autocomplete="new-password" placeholder="新規登録・変更時だけ入力"><button class="button" type="button" data-delete="openai">登録を削除</button></span><span class="configured" id="configured-openai"></span></span></span></span></label>
      <label class="provider"><input type="radio" name="provider" value="anthropic"><span><span class="provider-name">Anthropic API</span><span class="help">写真をAnthropicへ送信します。</span><span class="fields"><span class="field"><label for="model-anthropic">モデル</label><select id="model-anthropic"></select></span><span class="field"><label for="key-anthropic">APIキー</label><span class="key-row"><input id="key-anthropic" type="password" autocomplete="new-password" placeholder="新規登録・変更時だけ入力"><button class="button" type="button" data-delete="anthropic">登録を削除</button></span><span class="configured" id="configured-anthropic"></span></span></span></span></label>
      <div class="actions"><button class="button primary" type="submit">設定を保存</button><a class="button" href="/">キャンセル</a></div>
      <p class="message" id="message" aria-live="polite"></p>
    </section>
  </form>
  <section class="panel"><h2>保存と公開範囲</h2><ul class="security"><li>APIキーはこのサーバーの設定ファイルへ保存し、画面には再表示しません。</li><li>設定ファイルは所有者だけが読める権限にします。</li><li>認証のない一般公開には対応していません。Tailscale内で使用してください。</li><li>写真はEXIF位置情報を除去し、保存しません。</li></ul></section>
</main><script>
const $=id=>document.getElementById(id);let current=null;const deleteKeys=new Set();
function show(text,error=false){$("message").textContent=text;$("message").className="message"+(error?" error":"")}
function render(data){current=data;document.querySelector('[name=provider][value="'+data.provider+'"]').checked=true;for(const provider of ["local","openai","anthropic"]){const select=$("model-"+provider);select.innerHTML=data.available_models[provider].map(item=>'<option value="'+item.id+'">'+item.label+'</option>').join("");select.value=data.models[provider]}const incompatible=data.incompatible_local_models||[];$("local-model-note").textContent=incompatible.length?"画像非対応のため選択対象外: "+incompatible.join("、"):"インストール済みの画像対応モデル";for(const provider of ["openai","anthropic"]){$("configured-"+provider).textContent=data.api_key_configured[provider]?"登録済み（変更する場合だけ新しいキーを入力）":"未登録"}}
async function load(){try{const r=await fetch("/api/settings");if(!r.ok)throw new Error("設定を読み込めませんでした");render(await r.json())}catch(e){show(e.message,true)}}
document.querySelectorAll("[data-delete]").forEach(button=>button.onclick=()=>{const provider=button.dataset.delete;deleteKeys.add(provider);$("key-"+provider).value="";$("configured-"+provider).textContent="保存すると登録を削除します"});
$("settingsForm").onsubmit=async e=>{e.preventDefault();const provider=document.querySelector("[name=provider]:checked")?.value;if(!provider)return;const payload={provider,models:{},api_keys:{},delete_keys:[...deleteKeys]};for(const name of ["local","openai","anthropic"])payload.models[name]=$("model-"+name).value;for(const name of ["openai","anthropic"]){const key=$("key-"+name).value.trim();if(key)payload.api_keys[name]=key}show("保存しています…");try{const r=await fetch("/api/settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.detail||"保存できませんでした");deleteKeys.clear();$("key-openai").value="";$("key-anthropic").value="";render(data);show("設定を保存しました。")}catch(e){show(e.message,true)}};
load();
</script></body></html>
