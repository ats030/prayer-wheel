<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4faf2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121a14" media="(prefers-color-scheme: dark)"><title>調べた記録 · Species Explorer</title><link rel="icon" href="/favicon.svg"><script src="/theme.js"></script><style>
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
:root{color-scheme:light dark;--bg:oklch(98.6% .008 150);--panel:oklch(100% 0 0);--raised:oklch(96.4% .012 150);--line:oklch(88% .016 150);--text:oklch(27% .025 155);--muted:oklch(46% .022 155);--accent:oklch(48% .12 152);--danger:oklch(48% .17 27);--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(14% .014 155);--panel:oklch(18% .016 155);--raised:oklch(22% .018 155);--line:oklch(31% .018 150);--text:oklch(96% .01 150);--muted:oklch(74% .02 150);--accent:oklch(78% .14 152);--danger:oklch(74% .15 25)}}
:root[data-theme="dark"]{--bg:oklch(14% .014 155);--panel:oklch(18% .016 155);--raised:oklch(22% .018 155);--line:oklch(31% .018 150);--text:oklch(96% .01 150);--muted:oklch(74% .02 150);--accent:oklch(78% .14 152);--danger:oklch(74% .15 25);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--font)}main{width:min(980px,calc(100% - 24px));margin:auto;padding:20px 0 60px}.top,.head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:12px}h1{font-size:22px;margin:0}.muted{color:var(--muted);font-size:12px}.btn{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--text);padding:0 13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;cursor:pointer}.btn:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.top-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.theme-toggle{min-width:84px;gap:6px}.mapbox,.entry,.empty{background:var(--panel);border:1px solid var(--line);border-radius:12px}.mapbox{padding:12px;margin-bottom:22px}.mapbox p{margin:0 0 8px}#historyMap{height:min(54vh,520px);min-height:320px;margin-top:10px;border-radius:8px;background:var(--raised)}.hidden{display:none!important}h2{font-size:14px;margin:0}.list{display:grid;gap:8px}.entry{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:12px;padding:12px}.thumb{width:80px;height:80px;object-fit:cover;border-radius:8px;background:var(--raised)}.name{font-weight:700}.detail{grid-column:2/-1}.delete{color:var(--danger)}.empty{padding:24px;color:var(--muted)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px}dialog img{display:block;max-width:85vw;max-height:78vh}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text)}@media(max-width:520px){.entry{grid-template-columns:64px minmax(0,1fr)}.thumb{width:64px;height:64px}.entry>.delete,.detail{grid-column:1/-1}}
</style></head><body><main><header class="top"><div><h1>調べた記録</h1><div class="muted">このブラウザだけに保存された記録</div></div><div class="top-actions"><button class="btn theme-toggle" id="themeToggle" type="button"><span class="theme-icon" aria-hidden="true">◐</span><span class="theme-label">自動</span></button><a class="btn" href="/">撮影へ戻る</a></div></header><section class="mapbox"><p class="muted" id="mapNotice">記録した場所を地図で見られます。<strong>「地図を表示」を押したときだけ</strong>、おおまかにした位置のまわりの地図をOpenStreetMapから読み込みます。押さなければ、場所がこの端末の外へ出ることはありません。写真や候補の名前は送りません。</p><button class="btn" id="showMap" type="button">地図を表示</button><div id="historyMap" class="hidden"></div></section><div class="head"><h2>これまでに調べたもの</h2><button class="btn delete" id="clear" type="button">すべて削除</button></div><div class="list" id="historyList"><div class="empty">読み込み中…</div></div><nav aria-label="法務情報" style="display:flex;gap:14px;margin-top:22px;font-size:12px"><a href="/privacy" style="color:var(--muted)">プライバシー</a><a href="/terms" style="color:var(--muted)">利用規約</a></nav></main><dialog id="lightbox"><button class="btn" id="close">閉じる</button><img id="large" alt="履歴の写真"></dialog><script>
const $=x=>document.getElementById(x),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function openDb(){return new Promise((ok,no)=>{const r=indexedDB.open("species-history",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("entries"))r.result.createObjectStore("entries",{keyPath:"id"})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function request(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function finished(t){return new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error)})}const title=e=>e.candidates?.[0]?.common_name_ja||e.category||"調べた記録";
async function all(){const d=await openDb(),t=d.transaction("entries"),v=await request(t.objectStore("entries").getAll());await finished(t);d.close();return v.sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}let mapEntries=[];
function loadLeaflet(){if(window.L)return Promise.resolve();return new Promise((ok,no)=>{const css=document.createElement("link");css.rel="stylesheet";css.href="/vendor/leaflet/leaflet.css";document.head.append(css);const js=document.createElement("script");js.src="/vendor/leaflet/leaflet.js";js.onload=()=>ok();js.onerror=()=>no(new Error("地図を読み込めませんでした。"));document.head.append(js)})}
async function showMap(){const button=$("showMap");button.disabled=true;button.textContent="地図を読み込み中…";try{await loadLeaflet();$("historyMap").classList.remove("hidden");map(mapEntries);button.remove()}catch(e){button.disabled=false;button.textContent="地図を表示";$("mapNotice").textContent=e.message}}
$("showMap").onclick=showMap;
function map(entries){const m=L.map("historyMap"),points=[];L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> | <a href="https://leafletjs.com">Leaflet</a>'}).addTo(m);entries.forEach(e=>{const a=Number(e.coordinates?.latitude),o=Number(e.coordinates?.longitude);if(Number.isFinite(a)&&Number.isFinite(o)){points.push([a,o]);L.marker([a,o]).addTo(m).bindPopup("<strong>"+esc(title(e))+"</strong><br>"+esc(new Date(e.createdAt).toLocaleString("ja-JP")))}});points.length?m.fitBounds(points,{padding:[24,24],maxZoom:15}):m.setView([36.2,138.2],5)}
async function render(){const entries=await all();mapEntries=entries;const located=entries.filter(e=>Number.isFinite(Number(e.coordinates?.latitude))&&Number.isFinite(Number(e.coordinates?.longitude)));$("showMap").disabled=!located.length;if(!located.length)$("mapNotice").textContent="場所を記録した記録がまだないため、地図は表示できません。";$("clear").disabled=!entries.length;$("historyList").innerHTML=entries.length?entries.map(e=>{const image=e.thumbnail?URL.createObjectURL(e.thumbnail):"";return '<article class="entry" data-id="'+esc(e.id)+'">'+(image?'<button class="btn photo" data-src="'+image+'"><img class="thumb" src="'+image+'" alt=""></button>':'<div class="thumb"></div>')+'<div><div class="name">'+esc(title(e))+'</div><div class="muted">'+esc(new Date(e.createdAt).toLocaleString("ja-JP"))+' · '+esc(e.provider||"")+'</div><div class="muted">'+esc(e.context?.location||"場所の記録なし")+'</div></div><button class="btn delete one">削除</button><details class="detail"><summary>調べた内容を見る</summary><p>'+esc(e.summary||"")+'</p><ol>'+(e.candidates||[]).map(c=>'<li>'+esc(c.common_name_ja||"候補")+' <span class="muted">'+esc(c.scientific_name||"")+'</span></li>').join("")+'</ol></details></article>'}).join(""):'<div class="empty">まだ調べた記録はありません。</div>';document.querySelectorAll(".photo").forEach(b=>b.onclick=()=>{$("large").src=b.dataset.src;$("lightbox").showModal()});document.querySelectorAll(".one").forEach(b=>b.onclick=async()=>{const d=await openDb(),t=d.transaction("entries","readwrite");t.objectStore("entries").delete(b.closest("article").dataset.id);await finished(t);location.reload()})}$("close").onclick=()=>$("lightbox").close();$("clear").onclick=async()=>{if(confirm("この端末に保存した記録をすべて削除しますか？")){const d=await openDb(),t=d.transaction("entries","readwrite");t.objectStore("entries").clear();await finished(t);location.reload()}};render().catch(e=>$("historyList").innerHTML='<div class="empty">記録を読み込めませんでした。 '+esc(e.message)+'</div>');
</script><style>.facts{display:grid;gap:5px;margin:10px 0;padding:10px;border-left:2px solid var(--accent);background:var(--raised)}.candidate{margin:12px 0}.label{margin-top:7px;color:var(--muted);font-size:11px}.candidate ul{margin:3px 0;padding-left:20px}.badge{display:inline-block;margin:3px 5px 0 0;padding:1px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px}</style><script>
function evidence(label,items){return items?.length?'<div class="label">'+label+'</div><ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':""}function fullCandidate(c){const rank=({species:"種の候補",genus:"属（近いなかま）の候補",family:"科（大きなグループ）の候補"})[c.taxon_rank]||"グループの記録なし",status=c.evidence_status==="uncertain"?"決め手なし":c.evidence_status==="corroborated"?"2つの方法で確認":"写真からの推測";return '<li class="candidate"><strong>'+esc(c.common_name_ja||"候補")+'</strong> <span class="muted">'+esc(c.scientific_name||"")+'</span><div><span class="badge">'+rank+'</span><span class="badge">'+status+'</span>'+(Number.isFinite(Number(c.confidence))?'<span class="badge">最大 '+esc(c.confidence)+'%</span>':"")+'</div>'+evidence("写真から見つけた特徴（AI抽出・未確認）",c.traits)+evidence("似ている種との見分け方",c.distinguishing_features)+evidence("合わない点",c.contradictions)+evidence("決め手が足りない理由",c.evidence_gaps)+(c.uncertainty?'<div class="label">もっと確かめたいこと</div><div>'+esc(c.uncertainty)+'</div>':"")+(c.sex&&c.sex!=="対象外"?'<div class="label">オス・メスの推測</div><div>'+esc(c.sex)+'</div>'+evidence("そう考えた理由",c.sex_evidence):"")+'</li>'}function fullDetail(e){const x=e.context||{},m=e.resultMeta||{},c=e.coordinates;return '<div class="facts">'+(e.summary?'<div>'+esc(e.summary)+'</div>':"")+(e.model?'<div>使ったAI：'+esc(e.model)+'</div>':"")+(x.observedDate?'<div>撮った日：'+esc(x.observedDate)+'</div>':"")+(x.size?'<div>大きさ：'+esc(x.size)+'</div>':"")+(x.location?'<div>撮った場所：'+esc(x.location)+'</div>':"")+(c?'<div>位置：'+esc(c.latitude)+'、'+esc(c.longitude)+'（おおまかな値）</div>':"")+(m.taxonomyChecked?'<div>学名を図鑑データで確認済み'+(m.rejectedCandidates?' · 除いた候補 '+esc(m.rejectedCandidates)+'件':"")+'</div>':"")+(m.plantnetUsed?'<div>Pl@ntNetもいっしょに使用</div>':"")+'</div><ol>'+(e.candidates||[]).map(fullCandidate).join("")+'</ol>'}async function enrich(){const records=await all(),byId=new Map(records.map(e=>[String(e.id),e]));document.querySelectorAll(".entry").forEach(node=>{const e=byId.get(node.dataset.id);if(e)node.querySelector(".detail").innerHTML='<summary>調べた内容を見る</summary>'+fullDetail(e)})}setTimeout(()=>enrich().catch(()=>{}),0);
</script><style>.affiliate{display:inline-flex;margin-top:9px;color:var(--accent);font-size:12px}</style><script>
async function addAffiliateLinks(){const settings=await fetch("/api/settings").then(r=>r.ok?r.json():null).catch(()=>null);if(!settings?.affiliate?.enabled)return;const records=await all(),byId=new Map(records.map(e=>[String(e.id),e]));document.querySelectorAll(".entry").forEach(node=>{const record=byId.get(node.dataset.id);if(!record)return;node.querySelectorAll(".candidate").forEach((item,index)=>{const c=record.candidates?.[index],noJa=c?.common_name_ja==="日本語名なし"||c?.common_name_ja==="和名未登録",name=noJa?c.scientific_name:c?.common_name_ja;if(!name)return;const link=document.createElement("a");link.className="affiliate";link.href="/affiliate/click?q="+encodeURIComponent(name+" "+(record.category||""));link.target="_blank";link.rel="sponsored noopener noreferrer";link.textContent="広告 · Amazonで"+name+"の関連商品を探す ↗";item.append(link)})})}setTimeout(()=>addAffiliateLinks().catch(()=>{}),0);
</script><script>const addAffiliateLinksOnce=addAffiliateLinks;let affiliateLinksAdded=false;addAffiliateLinks=async()=>{if(affiliateLinksAdded)return;affiliateLinksAdded=true;await addAffiliateLinksOnce()};setTimeout(()=>enrich().then(addAffiliateLinks).catch(()=>{}),0);</script></body></html>
