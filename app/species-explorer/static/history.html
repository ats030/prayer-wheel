<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>判定履歴 · Species Explorer</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
:root{color-scheme:dark;--bg:#010102;--panel:#0f1011;--raised:#18191a;--line:#292b30;--text:#f7f8f8;--muted:#9ca1aa;--accent:#828fff;--danger:#fb7185;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--font)}main{width:min(980px,calc(100% - 24px));margin:auto;padding:20px 0 60px}.top,.head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:12px}h1{font-size:22px;margin:0}.muted{color:var(--muted);font-size:12px}.btn{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--text);padding:0 13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;cursor:pointer}.btn:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.mapbox,.entry,.empty{background:var(--panel);border:1px solid var(--line);border-radius:12px}.mapbox{padding:12px;margin-bottom:22px}.mapbox p{margin:0 0 8px}#historyMap{height:min(54vh,520px);min-height:320px;border-radius:8px;background:var(--raised)}h2{font-size:14px;margin:0}.list{display:grid;gap:8px}.entry{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:12px;padding:12px}.thumb{width:80px;height:80px;object-fit:cover;border-radius:8px;background:var(--raised)}.name{font-weight:700}.detail{grid-column:2/-1}.delete{color:var(--danger)}.empty{padding:24px;color:var(--muted)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px}dialog img{display:block;max-width:85vw;max-height:78vh}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text)}@media(max-width:520px){.entry{grid-template-columns:64px minmax(0,1fr)}.thumb{width:64px;height:64px}.entry>.delete,.detail{grid-column:1/-1}}
</style></head><body><main><header class="top"><div><h1>判定履歴</h1><div class="muted">このブラウザだけに保存された記録</div></div><a class="btn" href="/">撮影へ戻る</a></header><section class="mapbox"><p class="muted">このページを開くと、丸め済み座標を含む範囲の地図タイルをOpenStreetMapから取得します。写真・候補名・履歴JSONは送信しません。</p><div id="historyMap"></div></section><div class="head"><h2>すべての履歴</h2><button class="btn delete" id="clear" type="button">すべて削除</button></div><div class="list" id="historyList"><div class="empty">読み込み中…</div></div></main><dialog id="lightbox"><button class="btn" id="close">閉じる</button><img id="large" alt="履歴の写真"></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>
const $=x=>document.getElementById(x),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function openDb(){return new Promise((ok,no)=>{const r=indexedDB.open("species-history",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("entries"))r.result.createObjectStore("entries",{keyPath:"id"})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function request(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function finished(t){return new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error)})}const title=e=>e.candidates?.[0]?.common_name_ja||e.category||"判定記録";
async function all(){const d=await openDb(),t=d.transaction("entries"),v=await request(t.objectStore("entries").getAll());await finished(t);d.close();return v.sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}function map(entries){const m=L.map("historyMap"),points=[];L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> | <a href="https://leafletjs.com">Leaflet</a>'}).addTo(m);entries.forEach(e=>{const a=Number(e.coordinates?.latitude),o=Number(e.coordinates?.longitude);if(Number.isFinite(a)&&Number.isFinite(o)){points.push([a,o]);L.marker([a,o]).addTo(m).bindPopup("<strong>"+esc(title(e))+"</strong><br>"+esc(new Date(e.createdAt).toLocaleString("ja-JP")))}});points.length?m.fitBounds(points,{padding:[24,24],maxZoom:15}):m.setView([36.2,138.2],5)}
async function render(){const entries=await all();map(entries);$("clear").disabled=!entries.length;$("historyList").innerHTML=entries.length?entries.map(e=>{const image=e.thumbnail?URL.createObjectURL(e.thumbnail):"";return '<article class="entry" data-id="'+esc(e.id)+'">'+(image?'<button class="btn photo" data-src="'+image+'"><img class="thumb" src="'+image+'" alt=""></button>':'<div class="thumb"></div>')+'<div><div class="name">'+esc(title(e))+'</div><div class="muted">'+esc(new Date(e.createdAt).toLocaleString("ja-JP"))+' · '+esc(e.provider||"")+'</div><div class="muted">'+esc(e.context?.location||"位置情報なし")+'</div></div><button class="btn delete one">削除</button><details class="detail"><summary>判定内容を確認</summary><p>'+esc(e.summary||"")+'</p><ol>'+(e.candidates||[]).map(c=>'<li>'+esc(c.common_name_ja||"候補")+' <span class="muted">'+esc(c.scientific_name||"")+'</span></li>').join("")+'</ol></details></article>'}).join(""):'<div class="empty">まだ判定履歴はありません。</div>';document.querySelectorAll(".photo").forEach(b=>b.onclick=()=>{$("large").src=b.dataset.src;$("lightbox").showModal()});document.querySelectorAll(".one").forEach(b=>b.onclick=async()=>{const d=await openDb(),t=d.transaction("entries","readwrite");t.objectStore("entries").delete(b.closest("article").dataset.id);await finished(t);location.reload()})}$("close").onclick=()=>$("lightbox").close();$("clear").onclick=async()=>{if(confirm("履歴をすべて削除しますか？")){const d=await openDb(),t=d.transaction("entries","readwrite");t.objectStore("entries").clear();await finished(t);location.reload()}};render().catch(e=>$("historyList").innerHTML='<div class="empty">履歴を読み込めませんでした。 '+esc(e.message)+'</div>');
</script><style>.facts{display:grid;gap:5px;margin:10px 0;padding:10px;border-left:2px solid var(--accent);background:var(--raised)}.candidate{margin:12px 0}.label{margin-top:7px;color:var(--muted);font-size:11px}.candidate ul{margin:3px 0;padding-left:20px}.badge{display:inline-block;margin:3px 5px 0 0;padding:1px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px}</style><script>
function evidence(label,items){return items?.length?'<div class="label">'+label+'</div><ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>':""}function fullCandidate(c){const rank=({species:"種候補",genus:"属候補",family:"科候補"})[c.taxon_rank]||"分類階級未記録",status=c.evidence_status==="uncertain"?"確証なし":c.evidence_status==="corroborated"?"独立照合済み":"写真推定";return '<li class="candidate"><strong>'+esc(c.common_name_ja||"候補")+'</strong> <span class="muted">'+esc(c.scientific_name||"")+'</span><div><span class="badge">'+rank+'</span><span class="badge">'+status+'</span>'+(Number.isFinite(Number(c.confidence))?'<span class="badge">推定 '+esc(c.confidence)+'%以下</span>':"")+'</div>'+evidence("写真上の観察点（AI抽出・未検証）",c.traits)+evidence("類似種との識別点",c.distinguishing_features)+evidence("矛盾",c.contradictions)+evidence("確証がない理由",c.evidence_gaps)+(c.uncertainty?'<div class="label">追加で確認</div><div>'+esc(c.uncertainty)+'</div>':"")+(c.sex&&c.sex!=="対象外"?'<div class="label">雌雄推定</div><div>'+esc(c.sex)+'</div>'+evidence("推定根拠",c.sex_evidence):"")+'</li>'}function fullDetail(e){const x=e.context||{},m=e.resultMeta||{},c=e.coordinates;return '<div class="facts">'+(e.summary?'<div>'+esc(e.summary)+'</div>':"")+(e.model?'<div>使用モデル：'+esc(e.model)+'</div>':"")+(x.observedDate?'<div>撮影日：'+esc(x.observedDate)+'</div>':"")+(x.size?'<div>大きさ：'+esc(x.size)+'</div>':"")+(x.location?'<div>撮影地域：'+esc(x.location)+'</div>':"")+(c?'<div>座標：'+esc(c.latitude)+'、'+esc(c.longitude)+'（丸め済み）</div>':"")+(m.taxonomyChecked?'<div>分類名照合済み'+(m.rejectedCandidates?' · 除外候補 '+esc(m.rejectedCandidates)+'件':"")+'</div>':"")+(m.plantnetUsed?'<div>Pl@ntNet併用</div>':"")+'</div><ol>'+(e.candidates||[]).map(fullCandidate).join("")+'</ol>'}async function enrich(){const records=await all(),byId=new Map(records.map(e=>[String(e.id),e]));document.querySelectorAll(".entry").forEach(node=>{const e=byId.get(node.dataset.id);if(e)node.querySelector(".detail").innerHTML='<summary>判定内容を確認</summary>'+fullDetail(e)})}setTimeout(()=>enrich().catch(()=>{}),0);
</script><style>.affiliate{display:inline-flex;margin-top:9px;color:var(--accent);font-size:12px}</style><script>
async function addAffiliateLinks(){const settings=await fetch("/api/settings").then(r=>r.ok?r.json():null).catch(()=>null);if(!settings?.affiliate?.enabled)return;const records=await all(),byId=new Map(records.map(e=>[String(e.id),e]));document.querySelectorAll(".entry").forEach(node=>{const record=byId.get(node.dataset.id);if(!record)return;node.querySelectorAll(".candidate").forEach((item,index)=>{const c=record.candidates?.[index],name=c?.common_name_ja==="和名未登録"?c.scientific_name:c?.common_name_ja;if(!name)return;const link=document.createElement("a");link.className="affiliate";link.href="/affiliate/click?q="+encodeURIComponent(name+" "+(record.category||""));link.target="_blank";link.rel="sponsored noopener noreferrer";link.textContent="広告 · Amazonで"+name+"の関連商品を探す ↗";item.append(link)})})}setTimeout(()=>addAffiliateLinks().catch(()=>{}),0);
</script><script>const addAffiliateLinksOnce=addAffiliateLinks;let affiliateLinksAdded=false;addAffiliateLinks=async()=>{if(affiliateLinksAdded)return;affiliateLinksAdded=true;await addAffiliateLinksOnce()};setTimeout(()=>enrich().then(addAffiliateLinks).catch(()=>{}),0);</script></body></html>
