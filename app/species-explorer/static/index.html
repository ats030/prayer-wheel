<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#010102">
  <title>Species Explorer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#010102;--panel:#0f1011;--panel2:#18191a;--line:#292b30;--text:#f7f8f8;--muted:#9ca1aa;--subtle:#6f737b;--accent:#5e6ad2;--accent2:#828fff;--danger:#fb7185;--radius:12px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(980px,calc(100% - 28px));margin:auto;padding:24px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:20px;letter-spacing:-.35px;margin:0}.subtitle{color:var(--muted);font-size:13px;margin-top:2px}.local{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}.panel h2{font-size:14px;margin:0 0 12px}.capture{display:grid;place-items:center;min-height:220px;border:1px dashed #3d4047;border-radius:10px;background:var(--panel2);cursor:pointer;text-align:center;padding:24px;transition:.15s}.capture:hover,.capture.drag{border-color:var(--accent);background:#1b1c27}.capture:focus-within{outline:2px solid var(--accent);outline-offset:2px}.capture strong{display:block;font-size:15px}.capture span{display:block;color:var(--muted);font-size:12px;margin-top:4px}#library,#camera{display:none}.actions{display:flex;gap:8px;margin-top:10px}.btn{flex:1;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);font:inherit;font-weight:600;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn:hover:not(:disabled){border-color:#555965}.btn.primary:hover:not(:disabled){background:var(--accent2)}.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}.btn:disabled{opacity:.5;cursor:not-allowed}.preview{width:100%;max-height:360px;object-fit:contain;border-radius:9px;background:#09090a}.placeholder{min-height:280px;display:grid;place-items:center;text-align:center;color:var(--subtle)}.status{min-height:22px;color:var(--muted);margin:12px 0 0}.status.error{color:var(--danger)}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #444;border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;margin-right:7px;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}.summary{color:var(--muted);margin:0 0 12px}.candidate{border-top:1px solid var(--line);padding:14px 0}.candidate:first-of-type{border-top:0;padding-top:0}.name-row{display:flex;justify-content:space-between;gap:12px}.name{font-weight:650}.latin{font-size:12px;color:var(--muted);font-style:italic}.confidence{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}.meter{height:3px;background:#303237;margin:8px 0 10px}.meter span{display:block;height:100%;background:var(--accent)}ul{margin:5px 0 8px;padding-left:18px}.uncertainty{font-size:12px;color:var(--muted);border-left:2px solid #454851;padding-left:9px}.sources{display:flex;gap:8px;margin-top:9px}.sources a{color:#b6bcff;text-decoration:none;font-size:12px}.notice{grid-column:1/-1;color:var(--muted);font-size:12px}.key-panel{grid-column:1/-1}.key-panel label{display:block;font-weight:650;margin-bottom:8px}.key-panel input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:0 12px;font:inherit}.key-panel input:focus{outline:2px solid var(--accent2);outline-offset:2px}.key-help{color:var(--muted);font-size:12px;margin:8px 0 0}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.local{white-space:normal}.placeholder{min-height:180px}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}.capture{transition:none}}
    .top-actions{display:flex;align-items:center;gap:8px}.settings-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);text-decoration:none;font-weight:600}.settings-link:hover{border-color:#555965;background:var(--panel2)}
    @media(max-width:760px){.top-actions{align-items:flex-end;flex-direction:column}}@media(max-width:480px){.local{display:none}.settings-link{padding:0 10px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div><h1>Species Explorer</h1><div class="subtitle">写真から植物・動物の候補を調べる</div></div><div class="top-actions"><div class="local" id="providerStatus">端末内サーバーで処理・写真は保存しません</div><a class="settings-link" id="settingsLink" href="/settings" aria-label="設定を開く">設定</a></div></header>
  <div class="grid">
    <section class="panel key-panel hidden" id="apiKeyPanel"><label id="apiKeyLabel" for="apiKey">APIキー</label><input id="apiKey" type="password" autocomplete="new-password" spellcheck="false"><p class="key-help" id="keyHelp">識別時だけ使用し、保存しません。</p></section><section class="panel"><h2>1. 写真を選ぶ</h2>
      <label class="capture" id="drop"><div><strong id="captureTitle">写真をここにドロップ</strong><span>または下のボタンから選択（15MBまで）</span></div><input id="library" type="file" accept="image/*"></label>
      <input id="camera" type="file" accept="image/*" capture="environment">
      <div class="actions"><button class="btn primary" id="cameraBtn">カメラで撮る</button><button class="btn" id="libraryBtn">写真を選ぶ</button></div>
      <p class="status" id="status" aria-live="polite">写真を1枚選んでください。</p>
    </section>
    <section class="panel"><h2>2. 写真を確認</h2><div id="previewEmpty" class="placeholder">選んだ写真がここに表示されます</div><img id="preview" class="preview hidden" alt="識別する写真のプレビュー"><button id="identify" class="btn primary hidden" style="width:100%;margin-top:10px">候補を調べる</button></section>
    <section class="panel" style="grid-column:1/-1"><h2>3. 識別候補</h2><div id="results" class="placeholder">識別すると、可能性の高い候補を最大3件表示します。</div></section>
    <aside class="panel notice">AIの画像判定には誤りがあります。食用・毒性・接触の安全性は、この結果だけで判断しないでください。候補名と実物の特徴を図鑑などで照合してください。</aside>
  </div>
</main><script>
const $=id=>document.getElementById(id);const requestedProvider=new URLSearchParams(location.search).get("provider");const provider=["local","openai","anthropic"].includes(requestedProvider)?requestedProvider:"local";const providerMeta={local:{name:"ローカルAI",status:"端末内サーバーで処理・写真は保存しません"},openai:{name:"OpenAI",status:"OpenAI APIで処理・写真は保存しません"},anthropic:{name:"Anthropic",status:"Anthropic APIで処理・写真は保存しません"}};$("providerStatus").textContent=providerMeta[provider].status;$("settingsLink").href="/settings?provider="+provider;if(provider!=="local"){$("apiKeyPanel").classList.remove("hidden");$("apiKeyLabel").textContent=providerMeta[provider].name+" APIキー";$("keyHelp").textContent="この識別リクエストだけに使用します。キーは保存しません。写真は"+providerMeta[provider].name+"へ送信されます。"}let selected=null;const drop=$('drop'),status=$('status'),preview=$('preview'),identify=$('identify');
function setFile(file){if(!file||!file.type.startsWith('image/')){showStatus('画像ファイルを選んでください。',true);return}selected=file;preview.src=URL.createObjectURL(file);preview.classList.remove('hidden');$('previewEmpty').classList.add('hidden');identify.classList.remove('hidden');$('captureTitle').textContent=file.name||'撮影した写真';showStatus('写真を確認して「候補を調べる」を押してください。')}
function showStatus(text,error=false,busy=false){status.className='status'+(error?' error':'');status.innerHTML=(busy?'<span class="spinner"></span>':'')+text}
$('libraryBtn').onclick=()=> $('library').click();$('cameraBtn').onclick=()=> $('camera').click();$('library').onchange=e=>setFile(e.target.files[0]);$('camera').onchange=e=>setFile(e.target.files[0]);
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function sourceUrl(name){return 'https://www.google.com/search?q='+encodeURIComponent(name+' 生物 図鑑')}
function render(data){if(!data.candidates.length){$('results').innerHTML='<div class="placeholder">写真だけでは候補を絞れませんでした。生物全体が明るく写るように撮り直してください。</div>';return}$('results').className='';$('results').innerHTML='<p class="summary"><strong>'+esc(data.category)+'</strong> · '+esc(data.summary)+'</p>'+data.candidates.map((c,i)=>'<article class="candidate"><div class="name-row"><div><div class="name">'+(i+1)+'. '+esc(c.common_name_ja)+'</div><div class="latin">'+esc(c.scientific_name)+'</div></div><div class="confidence">確度 '+c.confidence+'%</div></div><div class="meter"><span style="width:'+c.confidence+'%"></span></div>'+(c.traits.length?'<ul>'+c.traits.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'')+(c.uncertainty?'<div class="uncertainty">追加で確認：'+esc(c.uncertainty)+'</div>':'')+'<div class="sources"><a target="_blank" rel="noopener" href="'+sourceUrl(c.common_name_ja)+'">図鑑を検索 ↗</a></div></article>').join('')}
identify.onclick=async()=>{if(!selected)return;const key=provider==="local"?"":$("apiKey").value.trim();if(provider!=="local"&&!key){showStatus("APIキーを入力してください。",true);$("apiKey").focus();return}identify.disabled=true;showStatus(providerMeta[provider].name+"が観察しています。しばらくお待ちください。",false,true);$('results').className='placeholder';$('results').textContent='写真の形・色・模様を確認中…';const fd=new FormData();fd.append("file",selected);fd.append("provider",provider);if(key)fd.append("api_key",key);try{const r=await fetch('/identify',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.detail||'識別できませんでした');render(data);showStatus('候補を表示しました。実物と照合してください。')}catch(e){$('results').innerHTML='<div class="placeholder">識別結果を取得できませんでした。</div>';showStatus(e.message,true)}finally{identify.disabled=false}};
</script></body></html>
